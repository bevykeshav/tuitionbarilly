<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuition Record</title>
<meta name="theme-color" content="#1f5f4a">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#1f5f4a;--on:#fff;--ln:#dedbd2;--soft:#e3efe9;--g:#0a7a2f;--r:#c62828;--b:#1565c0;--gs:#e6f4ea;--rs:#fdecea;--bs:#e8f0fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#222320;--tx:#efeee9;--mu:#9d9b93;--ac:#5cb592;--on:#10201a;--ln:#383a35;--soft:#25352e;--g:#5cb592;--r:#ef7b78;--b:#7ab3ef;--gs:#1f3329;--rs:#3a2423;--bs:#202c3d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:0 12px 40px}
button,input,select{font:inherit;color:var(--tx)}
button{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;min-height:40px}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px}
.hd{padding:14px 0 6px}
.hd h1{margin:0;font-size:22px}
.mu{color:var(--mu);font-size:14px}
.fs{font-size:12px;color:var(--mu)}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;font-size:14px;padding:8px 2px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.c h2{margin:0 0 6px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .c{margin:0}
.big{font-size:26px;font-weight:700;line-height:1.1}
.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}
.bx{border-radius:12px;padding:10px 12px;margin:10px 0}
.bx.r{background:var(--rs);border:1px solid var(--r);color:var(--tx)}
.bx.g{background:var(--gs);border:1px solid var(--g);color:var(--tx)}
.bx.b{background:var(--bs);border:1px solid var(--b);color:var(--tx)}
.bx b{display:block;margin-bottom:4px}
.bx div{margin:2px 0}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ac)}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.badge.g{background:var(--gs);color:var(--g)}.badge.r{background:var(--rs);color:var(--r)}.badge.b{background:var(--bs);color:var(--b)}
.row{display:flex;gap:8px;margin:4px 0;align-items:flex-start}
.row .k{flex:none;width:92px;color:var(--mu);font-size:14px}
.row .v{flex:1;white-space:pre-wrap;word-break:break-word}
.day{padding:10px 12px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:12px;padding:1px 9px;margin:2px 4px 2px 0;font-size:13px}
.chip.r{border-color:var(--r);color:var(--r)}
details{margin:4px 0}summary{cursor:pointer;padding:4px 0}
.ft{text-align:center;margin-top:16px}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.wk .n{font-size:20px;font-weight:700;line-height:1.2}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calh{font-size:12px;color:var(--mu);text-align:center}
.cal{border-radius:8px;padding:8px 0;font-size:14px;border:1px solid var(--ln)}
.cal.p{background:var(--gs);color:var(--g);border-color:var(--g);font-weight:600}
.cal.a{background:var(--rs);color:var(--r);border-color:var(--r);font-weight:600}
.cal.h{background:var(--bs);color:var(--b);border-color:var(--b)}
.cal.n{color:var(--mu)}
.cal.f{opacity:.35}
.cal.td{outline:2px solid var(--ac);outline-offset:1px}
.cal[data-cd]{cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--mu)}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--ln)}
.tap{cursor:pointer}.tap.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.pimg{max-width:100%;border-radius:8px;border:1px solid var(--ln);display:block}
</style></head><body>
<div id="app"></div>
<script>
const URL_='https://script.google.com/macros/s/AKfycbzVTdVBoJtSjvCiQPbuLv6ovyJBH2QJm47WFXxXgv5O10dR4v6A5r16iWCiOIN1fRiYoQ/exec';
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dayName=d=>DN[new Date(d+'T00:00:00').getDay()];
const isSun=d=>new Date(d+'T00:00:00').getDay()===0;
const ddiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const FX={'01-01':'New Year','01-14':'Makar Sankranti / Pongal','01-26':'Republic Day','04-14':'Ambedkar Jayanti','08-15':'Independence Day','09-05':"Teachers' Day",'10-02':'Gandhi Jayanti','11-14':"Children's Day",'12-25':'Christmas'};
const FV={'2026-11-06':'Dhanteras','2026-11-07':'Choti Diwali','2026-11-08':'Diwali','2026-11-09':'Govardhan Puja','2026-11-11':'Bhai Dooj','2026-11-15':'Chhath Puja','2026-11-24':'Guru Nanak Jayanti','2027-02-11':'Vasant Panchami','2027-03-06':'Maha Shivratri','2027-03-10':'Eid-ul-Fitr','2027-03-22':'Holi','2027-04-15':'Ram Navami','2027-08-17':'Raksha Bandhan','2027-08-25':'Janmashtami','2027-09-04':'Ganesh Chaturthi','2027-10-19':'Dussehra','2027-10-29':'Diwali'};
const fest=d=>(D&&D.hol&&D.hol[d])||FV[d]||FX[d.slice(5)]||'';
const pct=r=>{const m=String(r.tmk||'').match(/([\d.]+)\s*\/\s*([\d.]+)/);return m&&+m[2]>0?+m[1]/+m[2]*100:null};
const nbS=r=>Object.keys(r).filter(k=>k.indexOf('nb_')===0&&r[k]==='S').map(k=>k.slice(3));
const nbH=r=>Object.keys(r).filter(k=>k.indexOf('nb_')===0&&r[k]==='H').map(k=>k.slice(3));

let D=null,DD=null,kid='',code='',tab='ov',month='',note='',loading=false,seen=0,ovSel='',calSel='';
try{kid=localStorage.getItem('pa_kid')||''}catch(e){}
try{code=localStorage.getItem('pa_code')||''}catch(e){}
const q=new URLSearchParams(location.search).get('c');
if(q){code=q.toUpperCase().replace(/[^A-Z0-9]/g,'');try{localStorage.setItem('pa_code',code)}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}}
const seenOf=k=>{try{return +localStorage.getItem('pa_seen_'+k.id)||0}catch(e){return 0}};
function setD(){
 if(!DD||!DD.kids||!DD.kids.length){D=null;return}
 const k=DD.kids.find(z=>z.id===kid)||DD.kids[0];
 D=Object.assign({},k,{teacher:DD.teacher,hol:DD.hol,ts:DD.ts});
 seen=seenOf(k);
}
try{const c=localStorage.getItem('pa_data');if(c&&code){DD=JSON.parse(c);setD()}}catch(e){}

async function load(silent){
 if(!code){draw();return}
 if(!silent){loading=true;note='';draw()}
 let redraw=!silent;
 try{
  const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'parent',c:code})}).then(z=>z.json());
  if(r&&r.ok&&r.kids&&r.kids.length){
   if(JSON.stringify(r)!==JSON.stringify(DD)||note)redraw=true;
   DD=r;note='';setD();try{localStorage.setItem('pa_data',JSON.stringify(r))}catch(e){}
  }else if(r&&r.error==='bad'){
   DD=null;D=null;code='';try{localStorage.removeItem('pa_code');localStorage.removeItem('pa_data')}catch(e){}
   note='This link is not valid any more. Please ask the teacher to send the link again.';redraw=true;
  }else if(r&&r.ok){note='The app is not ready yet. Please ask the teacher.';redraw=true}
  else if(!silent)note='Could not load right now. Please try again.';
 }catch(e){if(!silent)note=D?'You are offline. Showing the last saved record.':'No internet. Please try again.'}
 loading=false;if(redraw)draw();
}
const isNew=()=>!!(D&&D.nu&&D.nu>seen);
function ft(ms){const d=new Date(ms),z=n=>String(n).padStart(2,'0');return z(d.getDate())+'/'+z(d.getMonth()+1)+' '+z(d.getHours())+':'+z(d.getMinutes())}
function markSeen(){seen=(D&&D.nu)||0;try{localStorage.setItem('pa_seen_'+D.id,String(seen))}catch(e){}}
function newBanner(){
 return isNew()?`<div class="bx g" style="border-width:2px"><b>\u{1F514} New update from the teacher${DD&&DD.kids.length>1?' for '+esc(D.student.name):''}</b><div class="mu">${ft(D.nu)} | Homework and today's record are updated.</div><div style="margin-top:8px;display:flex;gap:8px"><button class="on" id="nvw" style="flex:1">View today</button><button id="nok" style="flex:1">OK</button></div></div>`:'';
}
function updBadge(){try{document.title=(isNew()?'\u{1F514} ':'')+'Tuition Record';if(navigator.setAppBadge){if(isNew())navigator.setAppBadge(1);else navigator.clearAppBadge()}}catch(e){}}
function todayIso(){return iso(new Date())}
function months(){
 const set={};set[todayIso().slice(0,7)]=1;
 Object.keys(D.recs||{}).forEach(d=>set[d.slice(0,7)]=1);
 return Object.keys(set).sort().reverse();
}
const mlabel=m=>MN[+m.slice(5,7)-1]+' '+m.slice(0,4);
function stats(m){
 const s={P:0,A:0,H:0,hy:0,hn:0,nb:0,tn:0,ts:[]};
 const y=+m.slice(0,4),mo=+m.slice(5,7),n=new Date(y,mo,0).getDate(),td=todayIso();
 for(let i=1;i<=n;i++){
  const d=m+'-'+String(i).padStart(2,'0');if(d>td)break;
  const r=D.recs[d]||{};
  if(r.att==='P')s.P++;else if(r.att==='A')s.A++;else if(r.att==='H'||(!r.att&&isSun(d)))s.H++;
  if(r.hw==='Y')s.hy++;if(r.hw==='N')s.hn++;
  if(nbS(r).length)s.nb++;
  if(r.tsub||r.tmk){s.tn++;const p=pct(r);if(p!==null)s.ts.push(p)}
 }
 return s;
}
function recent(n){
 const out=[],td=todayIso();
 Object.keys(D.recs).sort().reverse().forEach(d=>{if(d<=td&&ddiff(d,td)<n)out.push(d)});
 return out;
}
function attBadge(r,d){
 if(r.att==='P')return '<span class="badge g">Present</span>';
 if(r.att==='A')return '<span class="badge r">Absent</span>';
 if(r.att==='H'||isSun(d))return '<span class="badge b">Holiday</span>';
 return '';
}
/* ---- photos (homework / classwork / test): loaded when the parent taps the button ---- */
const PHC={},PHB={};
const PHL={hw:'Homework photo',wk:'Classwork photo',ts:'Test photo'};
function phHtml(d,only){
 return ((D&&D.ph&&D.ph[d])||[]).slice().sort((a,b)=>['hw','wk','ts'].indexOf(a)-['hw','wk','ts'].indexOf(b)).filter(k=>!only||only.includes(k)).map(k=>{
  const id=D.id+'|'+d+'|'+k,u=PHC[id];
  if(u)return `<div class="row"><div class="k">${PHL[k]}</div><div class="v"><img class="pimg" src="${u}" alt="${PHL[k]}"></div></div>`;
  const s=PHB[id];
  return `<div class="row"><div class="k">${PHL[k]}</div><div class="v"><button data-ph="${id}">${s==='l'?'Loading...':s==='e'?'Try again':'\u{1F4F7} View photo'}</button></div></div>`;
 }).join('');
}
async function phLoad(id){
 if(PHB[id]==='l')return;
 PHB[id]='l';draw();
 const p=id.split('|');
 try{
  const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'photo',c:code,i:p[0],d:p[1],p:p[2]})}).then(z=>z.json());
  if(r&&r.ok&&r.img){PHC[id]=r.img;delete PHB[id]}else PHB[id]='e';
 }catch(e){PHB[id]='e'}
 draw();
}
function hwTop(){
 const td=todayIso();
 const days=Object.keys(D.recs).filter(d=>d<=td&&String(D.recs[d].hwtext||'').trim()).sort();
 if(!days.length)return '';
 const d=days[days.length-1],r=D.recs[d],k=ddiff(d,td);
 const when=k===1?'Yesterday':dayName(d)+' '+fmt(d).slice(0,5);
 return `<div class="bx b" style="border-width:2px"><b>\u{1F4DD} ${k===0?"Today's homework":'Last homework | '+when}</b><div style="white-space:pre-wrap">${esc(r.hwtext)}</div>${r.work?`<div class="mu" style="margin-top:6px"><b>Covered in class:</b> ${esc(r.work)}</div>`:''}${phHtml(d,['hw'])}</div>`;
}
function hwStreak(){
 let run=0,best=0;
 Object.keys(D.recs).sort().forEach(d=>{const v=D.recs[d].hw;if(v==='Y'){run++;if(run>best)best=run}else if(v==='N')run=0});
 return {cur:run,best};
}
function weekCard(){
 const td=todayIso(),t0=new Date(td+'T00:00:00'),dow=(t0.getDay()+6)%7,st=iso(new Date(t0.getTime()-dow*864e5));
 let P=0,A=0,hy=0,hn=0,tn=0;const ts=[];
 for(let i=0;i<=dow;i++){
  const d=iso(new Date(new Date(st+'T00:00:00').getTime()+i*864e5)),r=D.recs[d];if(!r)continue;
  if(r.att==='P')P++;else if(r.att==='A')A++;
  if(r.hw==='Y')hy++;else if(r.hw==='N')hn++;
  if(r.tsub||r.tmk){tn++;const p=pct(r);if(p!==null)ts.push(p)}
 }
 const ta=ts.length?Math.round(ts.reduce((a,b)=>a+b,0)/ts.length):null,hw=hy+hn,sk=hwStreak();
 const has=P+A+hw+tn>0;
 return `<div class="c"><h2>This week <span class="mu">${fmt(st).slice(0,5)} to ${fmt(td).slice(0,5)}</span></h2>
 ${has?`<div class="wk">
  <div><div class="n g">${P}</div><div class="fs">Present</div></div>
  <div><div class="n ${A?'r':''}">${A}</div><div class="fs">Absent</div></div>
  <div><div class="n ${hw?(hy/hw>=0.7?'g':'r'):''}">${hw?hy+'/'+hw:'-'}</div><div class="fs">Homework done</div></div>
  <div><div class="n ${ta===null?'':ta>=40?'g':'r'}">${ta===null?'-':ta+'%'}</div><div class="fs">${tn?tn+' test'+(tn===1?'':'s'):'Tests'}</div></div>
 </div>`:'<div class="mu">No records yet this week.</div>'}
 ${sk.cur>=2?`<div class="bx g" style="margin:10px 0 0">\u{1F525} <b style="display:inline">${sk.cur} homeworks in a row completed</b>${sk.best>sk.cur?' <span class="mu">| Best: '+sk.best+'</span>':''}</div>`:''}</div>`;
}
function chartCard(){
 const t=[];
 Object.keys(D.recs).sort().forEach(d=>{const p=pct(D.recs[d]);if(p!==null)t.push({d,p})});
 if(t.length<2)return '';
 const L=t.slice(-10),n=L.length,W=320,H=140,pl=24,pr=6,pt=14,pb=26,cw=(W-pl-pr)/n,bw=Math.min(26,cw-6);
 const y=v=>pt+(H-pt-pb)*(1-v/100);
 let g='';
 [0,50,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ln)"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end" style="fill:var(--mu);font-size:9px">${v}</text>`});
 L.forEach((x,i)=>{
  const cx=pl+cw*i+cw/2,cl=x.p>=70?'g':x.p>=40?'b':'r',top=y(x.p);
  g+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(1,y(0)-top)}" rx="3" style="fill:var(--${cl})"/><text x="${cx}" y="${top-3}" text-anchor="middle" style="fill:var(--tx);font-size:9px;font-weight:600">${Math.round(x.p)}</text><text x="${cx}" y="${H-12}" text-anchor="middle" style="fill:var(--mu);font-size:8px">${fmt(x.d).slice(0,5)}</text>`;
 });
 let tr='';
 if(t.length>=4){
  const av=a=>a.reduce((s,x)=>s+x.p,0)/a.length,df=av(t.slice(-3))-av(t.slice(-6,-3));
  tr=`<div class="fs" style="margin-top:4px">Trend (last 3 tests vs the 3 before): ${df>=5?'<b class="g">Improving \u2191</b>':df<=-5?'<b class="r">Going down \u2193</b>':'<b>Steady</b>'}</div>`;
 }
 return `<div class="c"><h2>Test marks graph <span class="mu">last ${n} tests, %</span></h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>
 <div class="lg"><span><i style="background:var(--g)"></i>70% or more</span><span><i style="background:var(--b)"></i>40 to 69%</span><span><i style="background:var(--r)"></i>Below 40%</span></div>${tr}</div>`;
}
function calHtml(){
 const y=+month.slice(0,4),mo=+month.slice(5,7),n=new Date(y,mo,0).getDate(),td=todayIso();
 const first=(new Date(y,mo-1,1).getDay()+6)%7;
 let cells='';
 for(let i=0;i<first;i++)cells+='<div></div>';
 for(let i=1;i<=n;i++){
  const d=month+'-'+String(i).padStart(2,'0'),r=D.recs[d]||{},fut=d>td;
  let cl='f';
  if(!fut)cl=r.att==='P'?'p':r.att==='A'?'a':(r.att==='H'||(!r.att&&isSun(d)))?'h':'n';
  cells+=`<div class="cal ${cl}${d===td?' td':''}"${D.recs[d]&&!fut?` data-cd="${d}"`:''}>${i}</div>`;
 }
 const sel=calSel&&calSel.slice(0,7)===month&&D.recs[calSel]?dayCard(calSel):'';
 return `<div class="c"><h2>Attendance calendar | ${esc(mlabel(month))}</h2><div class="calg">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<div class="calh">${x}</div>`).join('')}${cells}</div>
 <div class="lg"><span><i style="background:var(--gs);border-color:var(--g)"></i>Present</span><span><i style="background:var(--rs);border-color:var(--r)"></i>Absent</span><span><i style="background:var(--bs);border-color:var(--b)"></i>Holiday</span><span><i></i>No entry</span></div>
 <div class="fs" style="margin-top:6px">Tap a date to see that day's record</div></div>${sel}`;
}
function subjCard(){
 const m={};
 Object.keys(D.recs).forEach(d=>{
  const r=D.recs[d],p=pct(r);if(p===null)return;
  const raw=String(r.tsub||'Test').replace(/\(.*?\)/g,'').trim()||'Test',key=raw.toLowerCase().replace(/\s+/g,' ');
  const o=m[key]||(m[key]={n:raw,s:0,c:0});o.s+=p;o.c++;
 });
 const a=Object.values(m).map(o=>({n:o.n.charAt(0).toUpperCase()+o.n.slice(1),a:Math.round(o.s/o.c),c:o.c})).sort((x,y)=>x.a-y.a);
 if(!a.length)return '';
 const weak=a.length>1&&a[0].a<70?`<div class="fs" style="margin-bottom:4px">Needs more practice: <b>${esc(a[0].n)}</b> (${a[0].a}%)</div>`:'';
 return `<div class="c"><h2>Subject-wise average</h2>${weak}${a.map(x=>{const cl=x.a>=70?'g':x.a>=40?'b':'r';return `<div style="margin:8px 0"><div class="row" style="margin:0"><div class="v"><b>${esc(x.n)}</b> <span class="fs">${x.c} test${x.c===1?'':'s'}</span></div><b class="${cl}">${x.a}%</b></div><div class="bar"><i style="width:${x.a}%;background:var(--${cl})"></i></div></div>`}).join('')}</div>`;
}
function ovDays(k){
 const n=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate(),td=todayIso(),out=[];
 for(let i=n;i>=1;i--){
  const d=month+'-'+String(i).padStart(2,'0');if(d>td)continue;
  const r=D.recs[d];if(!r)continue;
  if((k==='P'&&r.att==='P')||(k==='A'&&r.att==='A')||(k==='hw'&&(r.hw==='Y'||r.hw==='N'))||(k==='ts'&&(r.tsub||r.tmk)))out.push(d);
 }
 return out;
}
function ovDetail(){
 if(!ovSel)return '';
 const T={P:'Present days',A:'Absent days',hw:'Homework record',ts:'Tests'},ds=ovDays(ovSel);
 let ex='';
 if(ovSel==='A'){
  const n=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate(),td=todayIso(),h=[];
  for(let i=1;i<=n;i++){const d=month+'-'+String(i).padStart(2,'0');if(d>td)break;const r=D.recs[d]||{};if(r.att==='H'||(!r.att&&isSun(d)))h.push(fmt(d).slice(0,5))}
  if(h.length)ex=`<div class="fs" style="margin:0 0 6px">Holidays (not counted as absent): ${h.join(', ')}</div>`;
 }
 return `<h2 style="margin:16px 0 4px;font-size:17px">${T[ovSel]} | ${esc(mlabel(month))} (${ds.length})</h2>${ex}${ovSel==='ts'?chartCard()+subjCard():''}${ds.length?ds.map(dayCard).join(''):'<div class="c mu">No records.</div>'}`;
}
function ovTab(){
 const s=stats(month),hw=s.hy+s.hn,hp=hw?Math.round(s.hy*100/hw):null,ta=s.ts.length?Math.round(s.ts.reduce((a,b)=>a+b,0)/s.ts.length):null;
 const bad=[],good=[];
 recent(7).forEach(d=>{
  const r=D.recs[d],l=dayName(d).slice(0,3)+' '+fmt(d).slice(0,5);
  if(r.att==='A')bad.push(l+': Absent');
  if(r.hw==='N')bad.push(l+': Homework not completed'+(r.hwnote?' ('+esc(r.hwnote)+')':''));
  if(nbS(r).length)bad.push(l+': Notebook kept at school ('+esc(nbS(r).join(', '))+')');
  const p=pct(r);
  if(p!==null&&p<40)bad.push(l+': Low marks in '+esc(r.tsub||'test')+' ('+esc(r.tmk)+')');
  if(p!==null&&p>=40)good.push(l+': '+esc(r.tsub||'Test')+' '+esc(r.tmk));
  if(r.nnote)bad.push(l+': '+esc(r.nnote));
  if(r.pnote)good.push(l+': '+esc(r.pnote));
 });
 const ex=upcoming(7).slice(0,4);
 return `
 ${hwTop()}
 ${weekCard()}
 <div class="fs" style="margin:6px 0 -2px">Tap a box to see its full record</div>
 <div class="grid">
  <div class="c tap${ovSel==='P'?' sel':''}" data-ov="P"><div class="mu">Present</div><div class="big g">${s.P}</div><div class="fs">days</div></div>
  <div class="c tap${ovSel==='A'?' sel':''}" data-ov="A"><div class="mu">Absent</div><div class="big ${s.A?'r':''}">${s.A}</div><div class="fs">days${s.H?' | Holidays: '+s.H:''}</div></div>
  <div class="c tap${ovSel==='hw'?' sel':''}" data-ov="hw"><div class="mu">Homework completed</div><div class="big ${hp===null?'':hp>=70?'g':'r'}">${hp===null?'-':hp+'%'}</div><div class="fs">${s.hy} of ${hw} times</div></div>
  <div class="c tap${ovSel==='ts'?' sel':''}" data-ov="ts"><div class="mu">Tests</div><div class="big ${ta===null?'':ta>=40?'g':'r'}">${ta===null?'-':ta+'%'}</div><div class="fs">${s.tn} taken (average)</div></div>
 </div>
 ${ovDetail()}
 ${calHtml()}
 ${s.nb?`<div class="c"><span class="r"><b>Notebook kept at school:</b></span> ${s.nb} day${s.nb===1?'':'s'} in ${esc(mlabel(month))}</div>`:''}
 ${ex.length?`<div class="bx b"><b>\u{1F4DD} Upcoming exams</b>${ex.map(e=>`<div>${exLabel(e.d)}: ${esc(e.s)}</div>`).join('')}</div>`:''}
 ${bad.length?`<div class="bx r"><b>\u{1F534} Needs attention (last 7 days)</b>${bad.map(t=>`<div>\u{1F534} ${t}</div>`).join('')}</div>`:''}
 ${good.length?`<div class="bx g"><b>\u{1F7E2} Good things (last 7 days)</b>${good.map(t=>`<div>\u2705 ${t}</div>`).join('')}</div>`:''}
 ${!bad.length&&!good.length?'<div class="c mu">No records in the last 7 days.</div>':''}`;
}
function dayTab(){
 const days=Object.keys(D.recs).filter(d=>d.slice(0,7)===month).sort().reverse();
 if(!days.length)return '<div class="c mu">No records in this month.</div>';
 return days.map(dayCard).join('');
}
function dayCard(d){
  const r=D.recs[d],f=fest(d),s=nbS(r),h=nbH(r),p=pct(r);
  return `<div class="c day"><div class="dh"><div><b>${fmt(d).slice(0,5)}</b> <span class="mu">${dayName(d)}</span>${f?` <span class="fs">\u{1F389} ${esc(f)}</span>`:''}</div>${attBadge(r,d)}</div>
  ${r.work?`<div class="row"><div class="k">Covered in class</div><div class="v">${esc(r.work)}</div></div>`:''}
  ${r.hwtext?`<div class="row"><div class="k">Homework</div><div class="v">${esc(r.hwtext)}</div></div>
  <div class="row"><div class="k">Homework done?</div><div class="v">${r.hw==='Y'?'<span class="badge g">Completed</span>':r.hw==='N'?'<span class="badge r">Not completed</span>'+(r.hwnote?' '+esc(r.hwnote):''):'<span class="mu">Not checked yet</span>'}</div></div>`:''}
  ${s.length||h.length?`<div class="row"><div class="k">Notebook</div><div class="v">${s.map(x=>`<span class="chip r">${esc(x)}: at school</span>`).join('')}${h.map(x=>`<span class="chip">${esc(x)}: with child</span>`).join('')}</div></div>`:''}
  ${r.tsub||r.tmk?`<div class="row"><div class="k">Test</div><div class="v">${esc(r.tsub||'')} <b class="${p===null?'':p>=40?'g':'r'}">${esc(r.tmk||'')}</b></div></div>`:''}
  ${phHtml(d)}
  ${r.pnote?`<div class="bx g" style="margin:6px 0 0">\u{1F7E2} ${esc(r.pnote)}</div>`:''}
  ${r.nnote?`<div class="bx r" style="margin:6px 0 0">\u{1F534} ${esc(r.nnote)}</div>`:''}
  ${r.note?`<div class="row"><div class="k">Note</div><div class="v">${esc(r.note)}</div></div>`:''}
  </div>`;
}
function testTab(){
 const t=[];Object.keys(D.recs).sort().reverse().forEach(d=>{const r=D.recs[d];if(r.tsub||r.tmk)t.push([d,r])});
 if(!t.length)return '<div class="c mu">No tests yet.</div>';
 const ps=t.map(x=>pct(x[1])).filter(v=>v!==null),a=ps.length?Math.round(ps.reduce((x,y)=>x+y,0)/ps.length):null;
 return `${a===null?'':`<div class="c"><span class="mu">Overall test average</span> <span class="big ${a>=40?'g':'r'}">${a}%</span></div>`}
 ${chartCard()}
 ${subjCard()}
 <div class="c">${t.map(([d,r])=>{const p=pct(r);return `<div class="row"><div class="k">${fmt(d).slice(0,5)}</div><div class="v">${esc(r.tsub||'Test')}</div><div><b class="${p===null?'':p>=40?'g':'r'}">${esc(r.tmk||'')}</b></div></div>${phHtml(d,['ts'])}`}).join('')}</div>`;
}
function exLabel(d){const k=ddiff(todayIso(),d);return k===0?'<b class="r">Today</b>':k===1?'<b>Tomorrow</b>':dayName(d).slice(0,3)+' '+fmt(d).slice(0,5)}
function allExams(){const a=[];(D.ds||[]).forEach(x=>(x.rows||[]).forEach(r=>a.push({d:r.d,s:r.s,n:x.name})));return a.sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0)}
function upcoming(n){const t=todayIso();return allExams().filter(e=>{const k=ddiff(t,e.d);return k>=0&&k<=n})}
function exTab(){
 const t=todayIso(),ex=allExams().filter(e=>e.d>=t),past=allExams().filter(e=>e.d<t).reverse();
 const syl=(D.syl||[]).map(y=>{
  let d=0,tt=0;y.subs.forEach(sb=>sb.items.forEach(i=>{tt++;if(i.d)d++}));
  const pc=tt?Math.round(d*100/tt):0;
  return `<div class="c"><h2>${esc(y.name)}</h2><b>${d} of ${tt} topics done (${pc}%)</b><div class="bar"><i style="width:${pc}%"></i></div>
  ${y.subs.map(sb=>{const sd=sb.items.filter(i=>i.d).length;return `<details><summary>${esc(sb.n)} <span class="mu">${sd}/${sb.items.length}</span></summary>${sb.items.map(i=>`<div class="row"><div class="v" style="${i.d?'opacity:.6;text-decoration:line-through':''}">${esc(i.t)}</div><div class="fs" style="flex:none">${i.d?'\u2705 '+fmt(i.d).slice(0,5):'Pending'}</div></div>`).join('')}</details>`}).join('')}</div>`;
 }).join('');
 return `<div class="c"><h2>Date sheet</h2>${ex.length?ex.map(e=>`<div class="row"><div class="k">${exLabel(e.d)}</div><div class="v">${esc(e.s)}${e.n?` <span class="fs">(${esc(e.n)})</span>`:''}</div></div>`).join(''):'<div class="mu">No upcoming exams.</div>'}
 ${past.length?`<details><summary class="mu">Past exams (${past.length})</summary>${past.map(e=>`<div class="row" style="opacity:.6"><div class="k">${fmt(e.d).slice(0,5)}</div><div class="v">${esc(e.s)}</div></div>`).join('')}</details>`:''}</div>
 <h2 style="margin:16px 0 0;font-size:17px">Syllabus progress</h2>${syl||'<div class="c mu">No syllabus added yet.</div>'}`;
}
function draw(){
 const el=$('app');
 if(!code||!D){
  el.innerHTML=`<div class="hd"><h1>\u{1F4D8} Tuition Record</h1><div class="mu">See your child's daily record. You can only view it.</div></div>
  <div class="c"><b>Please open the link the teacher sent you on WhatsApp.</b><p class="mu">You only need to do this once. After that this app opens by itself.</p>${note?`<p class="r">${esc(note)}</p>`:''}${loading?'<p class="mu">Loading...</p>':''}</div>`;
  return;
 }
 const ms=months();if(!month||!ms.includes(month))month=ms[0];
 const upd=D.ts?new Date(D.ts):null,u=upd?String(upd.getDate()).padStart(2,'0')+'/'+String(upd.getMonth()+1).padStart(2,'0')+' '+String(upd.getHours()).padStart(2,'0')+':'+String(upd.getMinutes()).padStart(2,'0'):'';
 const body=tab==='ov'?ovTab():tab==='day'?dayTab():tab==='test'?testTab():exTab();
 el.innerHTML=`<div class="hd"><h1>${esc(D.student.name)}</h1><div class="mu">Class ${esc(D.student.cls)}${D.teacher?' | Teacher: '+esc(D.teacher):''}</div>${u?`<div class="fs">Updated ${u}</div>`:''}</div>
 ${DD&&DD.kids.length>1?`<div style="display:flex;gap:8px;margin:6px 0">${DD.kids.map(k=>`<button class="${k.id===D.id?'on':''}" data-k="${esc(k.id)}" style="flex:1">${esc(k.student.name)}${k.nu&&k.nu>seenOf(k)?' \u{1F514}':''}</button>`).join('')}</div>`:''}
 ${newBanner()}${note?`<div class="bx b">${esc(note)}</div>`:''}
 <div class="tabs">${[['ov','Overview'],['day','Daily'],['test','Tests'],['ex','Exams']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>
 ${tab==='ov'||tab==='day'?`<select id="mon">${ms.map(m=>`<option value="${m}"${m===month?' selected':''}>${esc(mlabel(m))}</option>`).join('')}</select>`:''}
 ${body}
 <div class="ft"><button id="rf">${loading?'Loading...':'Refresh'}</button></div>`;
 el.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();window.scrollTo(0,0)});
 const sel=$('mon');if(sel)sel.onchange=()=>{month=sel.value;draw()};
 const nv=$('nvw');if(nv)nv.onclick=()=>{markSeen();tab='day';month=todayIso().slice(0,7);draw();window.scrollTo(0,0)};
 const nk=$('nok');if(nk)nk.onclick=()=>{markSeen();draw()};
 updBadge();
 el.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>phLoad(b.dataset.ph));
 el.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{calSel=calSel===b.dataset.cd?'':b.dataset.cd;draw()});
 el.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{ovSel=ovSel===b.dataset.ov?'':b.dataset.ov;draw()});
 $('rf').onclick=()=>load();
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kid=b.dataset.k;try{localStorage.setItem('pa_kid',kid)}catch(e){}setD();draw();window.scrollTo(0,0)});
}
draw();load();
setInterval(()=>{if(!document.hidden&&code&&!loading)load(true)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&code)load(true)});
</script></body></html>
