<script>

const DEF_URL='https://script.google.com/macros/s/AKfycbzVTdVBoJtSjvCiQPbuLv6ovyJBH2QJm47WFXxXgv5O10dR4v6A5r16iWCiOIN1fRiYoQ/exec';

async function doPush(){
 if(busy){again=true;return}busy=true;
 try{const r=await call({a:'put',data:S});sy(r.ok?'Cloud: save ho gaya':'Cloud: error aaya, dobara try hoga')}
 catch(e){sy('Cloud: net nahi hai, net aate hi sync hoga');again=true}

}
async function pull(){
 if(!CU)return;sy('Cloud se check ho raha hai...');
 try{
  const r=await call({a:'get'});
  if(!r.ok){sy('Cloud: error, link check karo');return}
  const rt=r.data?(r.data.ts||0):0;
  if(rt>(S.ts||0)){S=Object.assign({students:[],recs:{},teacher:'Keshav Gangwar',subjects:['SST','Math','Science','Hindi','English']},r.data);persist();dk='';dirty=false;draw();sy('Cloud se data aa gaya')}
  else if((S.ts||0)>rt){await doPush()}

 }catch(e){sy('Cloud: net nahi hai')}
}

function okLeave(){if(!dirty)return true;if(confirm('Save nahi kiya hai. Bina save kiye chhod dein?')){dirty=false;dk='';ttk='';if(sylSel){const o=SY().find(x=>x.id===sylSel);sd=o?JSON.parse(JSON.stringify(o)):null}return true}return false}
function doSave(){
 const o=S.recs[date]||(S.recs[date]={});o[sel]=JSON.parse(JSON.stringify(dr));
 const p0=prevHw(sel,date);if(p0&&dhw!==undefined){S.recs[p0][sel].hw=dhw;S.recs[p0][sel].hwnote=dhw==='N'?dhn.trim():''}
 store();
 for(const kd of KP){if(dph[kd]!==undefined){const k=pkk(date,sel,kd);PH[k]=dph[kd];pput(k,dph[kd])}}dph={};

}

function seg(r,f,opts,pd){return `<div class="seg">${opts.map(([v,l])=>`<button class="${r[f]===v?'on':''}" data-f="${f}" data-v="${v}"${pd?` data-pd="${pd}"`:''}>${l}</button>`).join('')}</div>`}
function prevHw(sid,d){const ks=Object.keys(S.recs).filter(k=>k<d&&((S.recs[k][sid]||{}).hwtext||'').trim()).sort();return ks.length?ks[ks.length-1]:null}
function vEntry(){
 if(!S.students.length)return '<div class="c">Pehle "Bacche" tab me bacchon ke naam jodo.</div>';
 if(!S.students.find(s=>s.id===sel))sel=S.students[0].id;
 if(dk!==date+'|'+sel){dk=date+'|'+sel;dr=JSON.parse(JSON.stringify(R(date,sel)));const p0=prevHw(sel,date);dhw=p0?(R(p0,sel).hw||''):undefined;dhn=p0?(R(p0,sel).hwnote||''):'';dph={};dirty=false;qSub='';wSub=''}
 const st=S.students.find(s=>s.id===sel),r=dr,pv=prevHw(sel,date);
 const chips=S.students.map(s=>`<button class="chip ${s.id===sel?'on':''} ${R(date,s.id).att?'done':''}" data-sel="${s.id}">${esc(s.name)}</button>`).join('');
 const full=r.att!=='A';
 return `<input type="date" id="dt" value="${date}"><div class="chips">${chips}</div>${ttBanner()}
 <div class="c"><h2>${esc(st.name)} <span class="mu">Class ${esc(st.cls)}</span></h2>
 ${pv?`<div style="background:var(--soft);border-radius:10px;padding:10px;margin:8px 0"><b>Pichle homework ki jaanch</b><p class="mu" style="margin:4px 0">${fmt(pv)} ko diya tha: ${esc(R(pv,sel).hwtext)}</p><label style="margin-top:8px">Homework karke laye?</label>${seg({hw:dhw},'hw',[['Y','Yes'],['N','No']],pv)}${dhw==='N'?`<label style="margin-top:8px">Kyu nahi kiya? (bacche ka karan)</label><textarea data-rn style="min-height:56px">${esc(dhn)}</textarea>`:''}</div>`:''}
 <div class="fg">
 <div class="fb"><label>Attendance</label>${seg(r,'att',[['P','Present'],['A','Absent']])}</div>
 <div class="fb"><label>Homework likho</label><textarea data-t="hwtext">${esc(r.hwtext)}</textarea><button class="sm" data-qo="1" style="margin-top:8px">${qOpen?'Quick homework chhupao':'Quick homework (syllabus se)'}</button>${qOpen?quickHw('hw'):''}<button class="pri" id="wa" style="margin-top:8px">Homework WhatsApp par bhejo</button></div>
 <div class="fb">${photoUI('hw','Homework ki photo (notebook ya book)')}</div>
 ${full?`<div class="fb"><label>Tuition par kya kiya</label><textarea data-t="work">${esc(r.work)}</textarea><button class="sm" data-wo="1" style="margin-top:8px">${wOpen?'Quick list chhupao':'Quick (syllabus se)'}</button>${wOpen?quickHw('wk'):''}${photoUI('wk','Tuition par kya kiya ki photo')}</div>
 <div class="fb"><label>Notebook (kaun si school me jama hai)</label>${SUB().map(sj=>`<div class="row"><div>${esc(sj)}</div>${seg(r,'nb_'+sj,[['H','Paas me'],['S','School me']])}</div>`).join('')}</div>
 <div class="fb"><label>Test (agar liya)</label><div class="row"><input data-t="tsub" placeholder="Subject / topic" value="${esc(r.tsub)}"><input data-t="tmk" placeholder="Marks jaise 18/20" value="${esc(r.tmk)}" style="max-width:140px"></div>${photoUI('ts','Test ya marks ki photo')}</div>
 <div class="fb"><label>Rating</label>${seg(r,'rt',[['Bad','Bad'],['Good','Good'],['Better','Better'],['Best','Best']])}</div>`:''}
 <div class="fb"><label>Note</label><textarea data-t="note">${esc(r.note)}</textarea></div>
 </div></div>
 <div class="sb"><span id="sv" class="${dirty?'warn':'mu'}">${dirty?'Save nahi hua':'Save ho chuka hai'}</span><button class="pri" id="svb">Save karo</button></div>`;
}
let _db=null;
function idb(){return _db||(_db=new Promise((ok,no)=>{try{const q=indexedDB.open('tms',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}}))}
async function pget(k){const d=await idb();return new Promise(ok=>{const r=d.transaction('p').objectStore('p').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function pput(k,v){const d=await idb();return new Promise(ok=>{const t=d.transaction('p','readwrite');v?t.objectStore('p').put(v,k):t.objectStore('p').delete(k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}
const PH={},pk=(d,s)=>d+'|'+s;
async function ensure(keys){let got=false;for(const k of keys){if(!(k in PH)){try{PH[k]=await pget(k)}catch(e){PH[k]=null}if(PH[k])got=true}}if(got)draw()}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.65))};im.onerror=no;im.src=u})}
function hint(t){const ls=String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let o=ls.slice(0,2).join('\n'),cut=ls.length>2;if(o.length>70){o=o.slice(0,70).replace(/\s+\S*$/,'');cut=true}return esc(o).replace(/\n/g,'<br>')+(cut?' ...':'')}
const pct=r=>{const m=String(r.tmk||'').match(/([\d.]+)\s*\/\s*([\d.]+)/);return m&&+m[2]>0?+m[1]/+m[2]*100:null};
function tCell(r){if(!r.tsub&&!r.tmk)return '-';const p=pct(r);const mk=r.tmk?(p===null?esc(r.tmk):col(esc(r.tmk),p>=40)):'';return (r.tsub?esc(r.tsub)+(mk?'<br>':''):'')+mk}
function summaryText(){
 const st=S.students.find(s=>s.id===rs);if(!st)return '';
 const rows=stats(rs),c=(f,v)=>rows.filter(x=>x[1][f]===v).length;
 const pl=(n,w)=>n+' '+w+(n===1?'':'s');
 const nb=rows.reduce((n,x)=>n+SUB().filter(s=>x[1]['nb_'+s]==='S').length,0);
 const tn=rows.filter(x=>x[1].tsub||x[1].tmk).length,tp=rows.map(x=>pct(x[1])).filter(v=>v!==null),ta=tp.length?Math.round(tp.reduce((a,b)=>a+b,0)/tp.length):null;
 const P=c('att','P'),A=c('att','A'),hy=c('hw','Y'),hn=c('hw','N'),bad=c('rt','Bad'),good=c('rt','Good')+c('rt','Better')+c('rt','Best');
 const pos=[],neg=[];
 if(P)pos.push('\u2705 Attendance: present for '+pl(P,'day'));
 if(hy)pos.push('\u2705 Homework completed: '+pl(hy,'time'));
 if(tn&&(ta===null||ta>=40))pos.push('\u2705 Tests taken: '+tn+(ta===null?'':' (average score '+ta+'%)'));
 if(good)pos.push('\u2705 Positive performance rating (Good/Better/Best): '+pl(good,'time'));
 if(A)neg.push('\u{1F538} Absent: '+pl(A,'day'));
 if(hn){neg.push('\u{1F538} Homework not completed: '+pl(hn,'time'));
  rows.filter(x=>x[1].hw==='N'&&x[1].hwnote).slice(0,3).forEach(x=>neg.push('     Reason ('+fmt(x[0]).slice(0,5)+'): '+String(x[1].hwnote).trim().slice(0,60)))}
 if(nb)neg.push('\u{1F538} Notebook found submitted at school: '+pl(nb,'time'));
 if(tn&&ta!==null&&ta<40)neg.push('\u{1F538} Test average needs improvement: '+ta+'%');
 if(bad)neg.push('\u{1F538} Below-expected performance rating: '+pl(bad,'time'));
 const L=['\u{1F4CA} *Progress Report: '+st.name+' (Class '+st.cls+')*','\u{1F5D3}\uFE0F Period: '+fmt(from)+' to '+fmt(to),''];
 if(pos.length)L.push('\u{1F31F} *Highlights*',...pos,'');
 L.push('\u{1F4CC} *Areas for Attention*');
 if(neg.length)L.push(...neg);else L.push('No concerns during this period.');
 const sy=sylInfo(rs);
 if(sy.length){L.push('','\u{1F4D8} *Syllabus Progress*');sy.forEach(x=>{L.push(x.n+': '+x.d+' of '+x.t+' topics completed ('+Math.round(x.d*100/x.t)+'%), '+(x.t-x.d)+' remaining');if(x.per.length)L.push('Covered this period: '+x.per.slice(0,5).join('; ')+(x.per.length>5?' ...':''))})}
 const enc=neg.length?'\u{1F64F} With a little extra attention at home, we are confident '+st.name+' will improve further. We will continue to work on this together.':(pos.length?'\u{1F31F} Excellent performance. Please encourage '+st.name+' to keep up the great work.':'');
 if(enc)L.push('',enc);
 L.push('','\u{1F4CE} The detailed report is attached as a PDF.','','Warm regards,','*'+S.teacher+'*','Tuition Teacher');
 return L.join('\n');
}
function waUrl(st,text){
 let p=(st&&st.ph)||'';if(p.length===10)p='91'+p;

 if(!/Android/i.test(navigator.userAgent))return web;
 const pkg=(st&&st.wt==='w')?'com.whatsapp':'com.whatsapp.w4b';

}

function wtSeg(cur,f){return `<div class="seg">${[['w','WhatsApp'],['b','Business']].map(([v,l])=>`<button class="${cur===v?'on':''}" data-wt="${v}" data-wtf="${f}">${l}</button>`).join('')}</div>`}

const SY=()=>S.syl||(S.syl=[]);
let sylSel=null,sd=null,sylF='all',editTxt=false,editStu=[],newStu=null;
function parseSyl(txt,old){
 const keep={};(old||[]).forEach(sb=>sb.items.forEach(it=>{if(it.d)keep[sb.n+'||'+it.t]=it.d}));
 const subs=[];let cur=null;
 String(txt||'').split(/\r?\n/).forEach(l=>{
  l=l.trim();if(!l)return;
  const m=l.match(/^#+\s*(.+)$/);
  if(m){cur={n:m[1].trim(),items:[]};subs.push(cur);return}
  if(!cur){cur={n:'General',items:[]};subs.push(cur)}
  const t=l.replace(/^[-*\u2022]+\s*/,'').trim();if(t)cur.items.push({t,d:keep[cur.n+'||'+t]||''});
 });
 return subs.filter(x=>x.items.length);
}
const toTxt=y=>y.subs.map(x=>'# '+x.n+'\n'+x.items.map(i=>i.t).join('\n')).join('\n\n');
const sylTot=y=>{let d=0,t=0;y.subs.forEach(x=>x.items.forEach(i=>{t++;if(i.d)d++}));return [d,t]};
const stuNames=ids=>S.students.filter(s=>(ids||[]).includes(s.id)).map(s=>s.name).join(', ')||'Koi nahi';
function stuChips(arr,attr){return S.students.map(s=>`<button class="chip ${arr.includes(s.id)?'on':''}" ${attr}="${s.id}">${esc(s.name)}</button>`).join('')}
function sylInfo(sid){return SY().filter(x=>(x.stu||[]).includes(sid)).map(x=>{const [d,t]=sylTot(x);const per=[];x.subs.forEach(sb=>sb.items.forEach(i=>{if(i.d&&i.d>=from&&i.d<=to)per.push(sb.n+': '+i.t)}));return {n:x.name,d,t,per}}).filter(x=>x.t)}
const SPROMPT=`Main tumhe school ke syllabus ki PDF ya photo bhej raha hu. Isko plain text mein badlo, bilkul is format mein:

# Subject ka naam
Topic 1
Topic 2

# Agla subject
Topic 1

Niyam (inhe zaroor maanna):

1. Har subject ka naam alag line par "# " laga ke likho, wahi naam jo table mein likha hai. Jaise Hindi Literature aur Hindi Grammar alag subject hain to alag "#" lagao.

2. Har chapter, topic ya activity ek alag line par likho. Do ya teen chapter ek line mein mat milao. Table ke do column hon to dono column ke topic alag alag line mein likho.

3. Jahan subject ke andar hisse hon (Reading, Literature, Grammar, Writing Skills, Workbook, Lab Activity, Map Work, Dictation, साहित्य, व्याकरण, अभ्यास पुस्तिका, श्रुतलेख, कविता पाठ), us hisse ka naam har line ke shuru mein colon ke saath likho. Jaise "Literature: Ch.8 Pooh Gets into a Tight Place" ya "साहित्य: पाठ-8 छुटकन ने नदी कैसे पार की". Isse ek hi naam ke do chapter alag pehchaane jaate hain.

4. Agar ek hi cheez ke kai number ek saath likhe hain (jaise "Workbook: Ch.7, 8" ya "Pg. No. 71 to 97"), to unhe ek hi line mein rakho.

5. Koi topic mat chhodna. Saare pages dekho. Syllabus mein jo bhi likha hai wo sab aana chahiye.

6. Apni taraf se kuch mat jodo aur kuch mat sudharo. Spelling bilkul waisi rakho jaisi syllabus mein hai. Hindi aur Sanskrit Devanagari mein likho. Agar PDF ka text kharab ya code jaisa dikhe (jaise "iBu&ikBu"), to use mat padho. Page ko tasveer ki tarah dekh kar likho.

7. School ka naam, address, session, class, S.N., aur exam ka naam (UT-2, Half Yearly) topic nahi hain. Inhe "#" ya topic mein mat likhna.

8. Koi emoji, bullet (-, •), numbering, table ya extra heading mat lagao.

9. Agar PDF mein kai classes hain, to har class ka text alag code block mein do aur har block ke upar class ka naam likho.

10. Jo shabd dhundhla ho ya pakka na ho, use apne andaaz se mat bharo. Use text mein jaisa dikhe waisa likho aur neeche "Pakka nahi" mein bata do.

Jawab sirf is tarah do:
- Pehli line: app mein syllabus ka naam kya rakhein (jaise "Class 3 UT-2").
- Phir poora text ek code block mein.
- Code block ke baad sirf ek line: "Total: X subject, Y topic". Agar kuch pakka nahi tha to uske neeche "Pakka nahi:" likhkar list do.
- Isse zyada kuch mat likhna.`;

function grpHw(txt){
 const groups=[],other=[];
 String(txt||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(l=>{
  const m=l.match(/^([^:]{1,40}):\s*(.+)$/);
  if(m&&/\s-\s/.test(m[2])){let g=groups.find(x=>x.sub===m[1].trim());if(!g){g={sub:m[1].trim(),items:[]};groups.push(g)}g.items.push(m[2].trim())}
  else other.push(l);
 });
 return {groups,other};
}

 const list=S.students.map(s=>editId===s.id?`<div style="background:var(--soft);border-radius:10px;padding:10px;margin:8px 0"><input data-en value="${esc(s.name)}" placeholder="Naam" style="margin-bottom:8px"><div class="row"><input data-ec value="${esc(s.cls)}" placeholder="Class" style="max-width:90px"><input data-ep inputmode="tel" value="${esc(s.ph)}" placeholder="Parent ka WhatsApp number"></div><label>Parent kaun sa WhatsApp use karta hai</label>${wtSeg(editWt,'e')}<div class="seg" style="margin-top:10px"><button class="on" id="esave">Save karo</button><button id="ecancel">Cancel</button></div></div>`:`<div class="row"><div>${esc(s.name)} <span class="mu">Class ${esc(s.cls)}${s.ph?' | '+esc(s.ph)+' ('+(s.wt==='w'?'WhatsApp':'Business')+')':''}</span></div><button data-edit="${s.id}">Badlo</button><button data-del="${s.id}">${pend===s.id?'Pakka hatao?':'Hatao'}</button></div>`).join('')||'<p class="mu">Abhi koi bacha nahi.</p>';
 return `<div class="c"><h2>Settings</h2><label>Teacher ka naam</label><input data-teacher value="${esc(S.teacher)}"><label>Notebook ke subject</label><input data-subjects value="${esc(SUB().join(', '))}"><p class="mu">Comma laga ke likho, jaise SST, Math, Science</p><button class="pri" id="ss">Settings save karo</button></div>
 <div class="c"><h2>Bacha jodo</h2><div class="row"><input id="nn" placeholder="Naam"><input id="nc" placeholder="Class" style="max-width:90px"></div><input id="np" inputmode="tel" placeholder="Parent ka WhatsApp number (zaruri nahi)" style="margin-bottom:8px"><label>Parent kaun sa WhatsApp use karta hai</label>${wtSeg(newWt,'n')}<button class="pri" id="add" style="margin-top:10px">Jodo</button></div>
 <div class="c"><h2>Sab bacche</h2>${list}</div>
 ${ttCard()}
 <div class="c"><h2>Cloud Backup (Google Sheets)</h2><input data-cu value="${esc(CU)}" placeholder="Apps Script ka web app link"><p class="mu">Doosre phone par pehle khali app me link daalo, tab purana data aa jayega.</p><button class="pri" id="cu">Abhi sync karo</button></div>
 <div class="c"><h2>Backup</h2><p class="mu">Data isi phone ke browser me rehta hai. Phone badalne se pehle backup le lo.</p><button id="bk">Backup save karo</button><label>Backup wapas lao</label><input type="file" id="rs" accept=".json"><p class="mu" id="ms">${esc(msg)}</p></div>`;
}
function draw(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 $v.innerHTML=tab==='entry'?vEntry():tab==='rep'?vRep():tab==='syl'?vSyl():vStu();
 if(tab==='entry'&&sel)ensure(KP.map(kd=>pkk(date,sel,kd)));
 else if(tab==='rep'&&rs)ensure(stats(rs).flatMap(x=>KP.map(kd=>pkk(x[0],rs,kd))));
}
const $v=document.getElementById('v');
function dlFile(name,blob){
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function mkpdf(){
 const ms=document.getElementById('ms'),el=document.getElementById('rp');
 ms.textContent='PDF ban rahi hai...';
 try{
  const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'});
  const m=20,w=595-2*m,k=w/cv.width,ph=Math.floor((842-2*m)/k);
  for(let y=0,p=0;y<cv.height;y+=ph,p++){
   const h=Math.min(ph,cv.height-y),t=document.createElement('canvas');t.width=cv.width;t.height=h;
   const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
   if(p)pdf.addPage();pdf.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',m,m,w,h*k);
  }
  const nm=S.students.find(s=>s.id===rs).name.replace(/[^A-Za-z0-9]+/g,'_')||'bacha';
  const fn='Report_'+nm+'_'+from+'_to_'+to+'.pdf',blob=pdf.output('blob');
  const f=new File([blob],fn,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   try{await navigator.share({files:[f],title:fn,text:summaryText()});ms.textContent='PDF share ho gayi.';return}catch(x){if(x&&x.name==='AbortError'){ms.textContent='Share cancel hua.';return}}
  }
  dlFile(fn,blob);ms.textContent='PDF download ho gayi.';
 }catch(e){ms.textContent='PDF nahi ban payi, dobara try karo.'}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){if(!okLeave())return;tab=d.tab;msg='';editId=null;draw()}
 else if(d.edit){editId=d.edit;pend=null;const e0=S.students.find(x=>x.id===d.edit);editWt=(e0&&e0.wt)||'b';draw()}
 else if(d.wt){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(d.wtf==='e')editWt=d.wt;else newWt=d.wt}
 else if(d.sel){if(!okLeave())return;sel=d.sel;draw()}
 else if(d.rs){rs=d.rs;draw()}
 else if(d.ph){dph[d.ph]=null;mark();draw()}
 else if(d.f){if(d.pd){dhw=(dhw===d.v)?'':d.v;mark()}else setF(d.f,d.v,true);draw()}
 else if(d.q){const n=new Date();to=iso(n);from=d.q==='w'?iso(new Date(n.getTime()-6*864e5)):iso(new Date(n.getFullYear(),n.getMonth(),1));draw()}
 else if(d.del){if(pend===d.del){S.students=S.students.filter(s=>s.id!==d.del);pend=null;store()}else pend=d.del;draw()}
 else if(b.id==='add'){const n=document.getElementById('nn').value.trim(),c=document.getElementById('nc').value.trim(),p=document.getElementById('np').value.replace(/\D/g,'');if(n){S.students.push({id:'s'+Date.now(),name:n,cls:c,ph:p,wt:newWt});store();draw()}}
 else if(b.id==='wa'){
  const st=S.students.find(s=>s.id===sel),r=dr;
  if(!r.hwtext||!r.hwtext.trim()){b.textContent='Pehle homework likho';return}
  const t=hwMessage(st);
  waOpen(st,t);
 }
 else if(b.id==='mk')mkpdf();
 else if(d.gtt){if(!okLeave())return;tab='stu';ttSel=sel;ttk='';draw();const e=document.getElementById('ttcard');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth'})}
 else if(d.tts){if(!okLeave())return;ttSel=d.tts;ttk='';draw()}
 else if(d.ttsub!==undefined){b.classList.toggle('on');const a=ttd[d.ttday]||(ttd[d.ttday]=[]),i=a.indexOf(d.ttsub);if(i>=0)a.splice(i,1);else a.push(d.ttsub);mark()}
 else if(b.id==='ttsave'){S.tt=S.tt||{};S.tt[ttSel]=JSON.parse(JSON.stringify(ttd));store();dirty=false;const m=document.getElementById('ttmsg');if(m)m.textContent='Time table save ho gaya.'}
 else if(b.id==='ttall'){if(!confirm('Sab bacchon ka time table isi jaisa ho jaayega. Pakka?'))return;S.tt=S.tt||{};S.students.forEach(x=>{S.tt[x.id]=JSON.parse(JSON.stringify(ttd))});store();dirty=false;const m=document.getElementById('ttmsg');if(m)m.textContent='Sab bacchon par lag gaya.'}
 else if(d.wo){wOpen=!wOpen;draw()}
 else if(d.ws){wSub=d.ws;draw()}
 else if(d.wh!==undefined){const l=WH[+d.wh];if(l){addWk(l);draw()}}
 else if(d.wg!==undefined){addWk(WKGEN[+d.wg]);draw()}
 else if(d.qo){qOpen=!qOpen;draw()}
 else if(d.qs){qSub=d.qs;draw()}
 else if(d.qh!==undefined){const l=QH[+d.qh];if(l){addHw(l);draw()}}
 else if(d.qg!==undefined){addHw(HWGEN[+d.qg]);draw()}
 else if(d.sopen){if(!okLeave())return;const o=SY().find(x=>x.id===d.sopen);sylSel=o?o.id:null;sd=o?JSON.parse(JSON.stringify(o)):null;sylF='all';editTxt=false;pend=null;dirty=false;draw()}
 else if(d.sylback){if(!okLeave())return;sylSel=null;sd=null;editTxt=false;pend=null;draw()}
 else if(d.sf){sylF=d.sf;draw()}
 else if(d.ti){const [si,ii]=d.ti.split('.').map(Number),it=sd.subs[si].items[ii];it.d=it.d?'':iso(new Date());mark();draw()}
 else if(d.sedit){editTxt=true;editStu=[...(sd.stu||[])];draw()}
 else if(d.es){b.classList.toggle('on');editStu=editStu.includes(d.es)?editStu.filter(x=>x!==d.es):[...editStu,d.es]}
 else if(b.id==='sxapply'){sd.subs=parseSyl(document.querySelector('[data-sxe]').value,sd.subs);sd.stu=[...editStu];editTxt=false;mark();draw()}
 else if(b.id==='sxcancel'){editTxt=false;draw()}
 else if(d.sdel){if(pend==='syl'){S.syl=SY().filter(x=>x.id!==sylSel);pend=null;sylSel=null;sd=null;dirty=false;store()}else pend='syl';draw()}
 else if(b.id==='ssv'){const i=SY().findIndex(x=>x.id===sd.id);if(i>=0)S.syl[i]=JSON.parse(JSON.stringify(sd));store();dirty=false;draw();const e=document.getElementById('sv');if(e){e.textContent='Save ho gaya';e.className='mu'}}
 else if(d.ns){b.classList.toggle('on');if(!newStu)newStu=S.students.map(s=>s.id);newStu=newStu.includes(d.ns)?newStu.filter(x=>x!==d.ns):[...newStu,d.ns]}
 else if(b.id==='snew'){const nm=document.querySelector('[data-sn]').value.trim(),subs=parseSyl(document.querySelector('[data-sx]').value),m=document.getElementById('smsg');if(!subs.length){m.textContent='Text khali hai ya sahi format me nahi hai. Subject ki line # se shuru honi chahiye.';return}SY().push({id:'y'+Date.now(),name:nm||'Syllabus',stu:newStu||S.students.map(s=>s.id),subs});newStu=null;store();draw()}
 else if(b.id==='sprompt'){try{await navigator.clipboard.writeText(SPROMPT);b.textContent='Prompt copy ho gaya'}catch(x){b.textContent='Copy nahi hua'}}
 else if(b.id==='ib'){if(ip){ip.prompt();ip=null;b.style.display='none'}}
 else if(b.id==='ecancel'){editId=null;draw()}
 else if(b.id==='esave'){const st=S.students.find(x=>x.id===editId),n=document.querySelector('[data-en]').value.trim();if(st&&n){st.name=n;st.cls=document.querySelector('[data-ec]').value.trim();st.ph=document.querySelector('[data-ep]').value.replace(/\D/g,'');st.wt=editWt;store()}editId=null;draw()}
 else if(b.id==='sw'){const st=S.students.find(s=>s.id===rs);waOpen(st,summaryText())}
 else if(b.id==='sc'){try{await navigator.clipboard.writeText(summaryText());b.textContent='Copy ho gaya'}catch(x){b.textContent='Copy nahi hua'}}
 else if(b.id==='svb')doSave();
 else if(b.id==='md'){MODE=MODE==='desk'?'phone':'desk';try{localStorage.setItem('tms_mode',MODE)}catch(x){}applyMode();draw()}
 else if(b.id==='ss'){S.teacher=document.querySelector('[data-teacher]').value.trim()||S.teacher;S.subjects=document.querySelector('[data-subjects]').value.split(',').map(x=>x.trim()).filter(Boolean);store();b.textContent='Save ho gaya'}
 else if(b.id==='cu'){const v=document.querySelector('[data-cu]').value.trim();CU=v;try{localStorage.setItem('tms_url',v)}catch(x){}if(S.students.length&&!S.ts){S.ts=Date.now();persist()}draw();pull()}
 else if(b.id==='bk'){dlFile('tuition-backup.json',new Blob([JSON.stringify(S)],{type:'application/json'}));document.getElementById('ms').textContent='Backup download ho gaya.'}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.t){setF(t.dataset.t,t.value,false)}
 else if(t.dataset.rn!==undefined){dhn=t.value;mark()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='dt'&&t.value){if(!okLeave()){draw();return}date=t.value;draw()}
 else if(t.dataset.pf&&t.files[0]){const kd=t.dataset.pf;shrink(t.files[0]).then(u=>{dph[kd]=u;mark();draw()}).catch(()=>{})}
 else if(t.id==='fr'&&t.value){from=t.value;draw()}
 else if(t.id==='to'&&t.value){to=t.value;draw()}
 else if(t.id==='rs'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);if(o&&Array.isArray(o.students)){S=Object.assign({students:[],recs:{},teacher:S.teacher,subjects:S.subjects},o);store();msg='Backup wapas aa gaya.'}else msg='Ye backup file sahi nahi lagti.'}catch(er){msg='Ye backup file sahi nahi lagti.'}draw()})}
});
applyMode();
draw();
pull();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
