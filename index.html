<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--ac:#1f5f4a;--on:#fff;--ln:#dedbd2;--soft:#e3efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#222320;--tx:#efeee9;--mu:#9d9b93;--ac:#5cb592;--on:#10201a;--ln:#383a35;--soft:#25352e}}
:root[data-theme="dark"]{--bg:#161715;--card:#222320;--tx:#efeee9;--mu:#9d9b93;--ac:#5cb592;--on:#10201a;--ln:#383a35;--soft:#25352e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:0 12px 40px}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.tabs button{flex:1;font-size:14px;padding:10px 4px}
.qb{display:block;width:100%;text-align:left;margin:4px 0;font-size:14px;min-height:40px;padding:8px 10px}
.bar2{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:8px 0}.bar2>i{display:block;height:100%;background:var(--ac)}
button,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
button.on,.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:0 0 6px;font-size:18px}
label{display:block;margin:12px 0 6px;color:var(--mu);font-size:14px}
input,textarea{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:10px}
textarea{min-height:72px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.grp{display:inline-flex;gap:6px;padding:4px;border:1px solid var(--ln);border-radius:14px;background:var(--soft);flex:none}
.chip{white-space:nowrap}.chip.done{border-color:var(--ac);background:var(--soft)}
.chip.on{background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*:first-child{flex:1}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);width:100%;font-weight:600}
.mu{color:var(--mu);font-size:14px}
.wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.sm{min-height:36px;padding:6px 12px;font-size:14px}
.warn{color:#d9433f;font-weight:600}
.fs{font-size:12px;color:var(--mu)}
.hol{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.sb{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--bg);padding:10px 0;border-top:1px solid var(--ln);margin-top:10px}
.sb .pri{width:auto;flex:1}
.desk body{max-width:1100px}
.desk .chips{flex-wrap:wrap;overflow:visible}
.desk .fg{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.pbx{border:1px solid #d9433f;border-radius:12px;padding:8px 10px;margin:6px 0;background:var(--card)}
#pb:empty{display:none}
.rp{width:800px;background:#fff;color:#111;padding:24px;font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:13px}
.rp h1{font-size:20px;margin:0 0 8px}.rp p{margin:2px 0}
.rp table{width:100%;border-collapse:collapse;margin:12px 0}
.rp th,.rp td{border:1px solid #444;padding:6px;text-align:left;vertical-align:top}
.rp th{background:#e8e8e8}
.rp .g{color:#0a7a2f;font-weight:700}.rp .r{color:#c62828;font-weight:700}.rp .h{color:#1565c0;font-weight:700}

<div class="tabs"><button data-tab="entry">Today's Entry</button><button data-tab="rep">PDF Report</button><button data-tab="syl">Syllabus</button><button data-tab="stu">Students</button></div>
<div class="bar"><div><span style="font-weight:600;font-size:18px" id="clk"></span><span class="mu" id="sy" style="margin-left:12px"></span></div><span><button class="sm" id="ib" style="display:none">Install App</button> <button class="sm" id="md"></button></span></div>
<div id="pb"></div>
<div id="v"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
let S={students:[],recs:{},teacher:'Keshav Gangwar',subjects:['SST','Math','Science','Hindi','English']};
const SUB=()=>(S.subjects&&S.subjects.length)?S.subjects:['SST','Math','Science'];
try{const r=localStorage.getItem('tms1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const persist=()=>{try{localStorage.setItem('tms1',JSON.stringify(S))}catch(e){}};
const store=()=>{S.ts=Date.now();persist();push()};
const DEF_URL='https://script.google.com/macros/s/AKfycbzVTdVBoJtSjvCiQPbuLv6ovyJBH2QJm47WFXxXgv5O10dR4v6A5r16iWCiOIN1fRiYoQ/exec';
let CU=DEF_URL;try{CU=localStorage.getItem('tms_url')||DEF_URL}catch(e){}
let KEY='';try{KEY=localStorage.getItem('tms_key')||''}catch(e){}
let tmr=null,busy=false,again=false,again2=false,pushP=null;
function sy(t){const e=document.getElementById('sy');if(e)e.textContent=t}
async function call(b){const r=await fetch(CU,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({k:KEY},b))});return r.json()}
function push(){if(!CU)return;clearTimeout(tmr);sy('Cloud: syncing...');tmr=setTimeout(doPush,2000)}
function doPush(){
 if(busy){again2=true;return pushP}
 busy=true;
 pushP=(async()=>{
  try{const r=await call({a:'put',data:S});sy(r.ok?'Cloud: saved':'Cloud: error, will retry')}
  catch(e){sy('Cloud: offline, will sync when online');again=true}
  busy=false;
  if(again2){again2=false;await doPush()}
  else if(again&&navigator.onLine){again=false;push()}
 })();
 return pushP;
}
async function pull(){
 if(!CU)return;sy('Checking cloud...');
 try{
  const r=await call({a:'get'});
  if(!r.ok){sy(r.error==='locked'?'Cloud: wrong or missing secret key':'Cloud: error, check the link');return}
  if(r.data&&r.data.students)r.data.students.forEach(c=>{const l=S.students.find(x=>x.id===c.id);if(l&&!l.pc&&okTok(c.pc))l.pc=c.pc});
  const rt=r.data?(r.data.ts||0):0;
  if(rt>(S.ts||0)){S=Object.assign({students:[],recs:{},teacher:'Keshav Gangwar',subjects:['SST','Math','Science','Hindi','English']},r.data);persist();dk='';dirty=false;draw();sy('Data loaded from cloud')}
  else if((S.ts||0)>rt){await doPush()}
  else sy('Cloud: everything is up to date')
  if(ensurePC()){await doPush();draw()}
 }catch(e){sy('Cloud: offline')}
}
let ip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=document.getElementById('ib');if(b)b.style.display=''});
window.addEventListener('appinstalled',()=>{ip=null;const b=document.getElementById('ib');if(b)b.style.display='none'});
window.addEventListener('online',()=>{if(again)push()});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Weekday, Sunday holiday and festival names ---- */
const FX={'01-01':'New Year','01-14':'Makar Sankranti / Pongal','01-26':'Republic Day','04-14':'Ambedkar Jayanti','08-15':'Independence Day','09-05':"Teachers' Day",'10-02':'Gandhi Jayanti','11-14':"Children's Day",'12-25':'Christmas'};
/* Festivals whose date changes every year (2026 and 2027). Eid dates depend on the moon, so they can shift by a day. Add or fix dates in Students > Settings > Custom holidays. */
const FV={
'2026-01-23':'Vasant Panchami','2026-02-15':'Maha Shivratri','2026-03-03':'Holika Dahan','2026-03-04':'Holi','2026-03-21':'Eid-ul-Fitr','2026-03-26':'Ram Navami','2026-03-31':'Mahavir Jayanti','2026-04-03':'Good Friday','2026-05-01':'Buddha Purnima','2026-05-27':'Bakrid (Eid-ul-Adha)','2026-06-26':'Muharram','2026-08-28':'Raksha Bandhan','2026-09-04':'Janmashtami','2026-09-14':'Ganesh Chaturthi','2026-10-11':'Navratri starts','2026-10-20':'Dussehra','2026-10-29':'Karwa Chauth','2026-11-06':'Dhanteras','2026-11-07':'Choti Diwali','2026-11-08':'Diwali','2026-11-09':'Govardhan Puja','2026-11-11':'Bhai Dooj','2026-11-15':'Chhath Puja','2026-11-24':'Guru Nanak Jayanti',
'2027-02-11':'Vasant Panchami','2027-03-06':'Maha Shivratri','2027-03-10':'Eid-ul-Fitr','2027-03-21':'Holika Dahan','2027-03-22':'Holi','2027-04-15':'Ram Navami','2027-08-17':'Raksha Bandhan','2027-08-25':'Janmashtami','2027-09-04':'Ganesh Chaturthi','2027-10-19':'Dussehra','2027-10-29':'Diwali'};
const dayName=d=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(d+'T00:00:00').getDay()];
const isSun=d=>new Date(d+'T00:00:00').getDay()===0;
const fest=d=>(S.hol&&S.hol[d])||FV[d]||FX[d.slice(5)]||'';
const holTxt=()=>Object.keys(S.hol||{}).sort().map(k=>k+' '+S.hol[k]).join('\n');
function parseHol(t){const o={};String(t||'').split(/\r?\n/).forEach(l=>{const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);if(m)o[m[1]]=m[2].trim()});return o}
function dateInfo(d){
 const f=fest(d),sun=isSun(d);
 return `<div class="hol" style="margin:4px 0 8px"><b>${dayName(d)}</b>${sun?' | <b>Holiday (Sunday)</b>':''}${f?' | \u{1F389} '+esc(f):''}</div>`;
}
/* ---- end ---- */

const today=new Date();
let tab='entry',date=iso(today),sel=null,rs=null,pend=null,msg='',editId=null,newWt='b',editWt='b';
let from=iso(new Date(today.getTime()-6*864e5)),to=iso(today);
const R=(d,s)=>((S.recs[d]||{})[s])||{};
let dr={},dk='',dhw,dhn='',dph={},dirty=false;
const KP=['hw','wk','ts'];
const pkk=(d,s,kd)=>kd==='hw'?d+'|'+s:d+'|'+s+'|'+kd;
function phv(kd){return dph[kd]!==undefined?dph[kd]:PH[pkk(date,sel,kd)]}
function photoUI(kd,label){const u=phv(kd);return `<label>${label}</label>${u?`<img src="${u}" style="max-width:160px;border-radius:8px;display:block;margin:6px 0"><button data-ph="${kd}">Remove photo</button>`:''}<input type="file" data-pf="${kd}" accept="image/*" capture="environment">`}
function imgH(kd,d){const u=PH[pkk(d,rs,kd)];return u?'<img src="'+u+'" style="width:100px;display:block;margin:4px 0;border:1px solid #444">':''}
const HRM=36e5;
function pendList(){
 const lim=iso(new Date(Date.now()-2*864e5)),a=[];
 Object.keys(S.recs).filter(d=>d>=lim).forEach(d=>S.students.forEach(s=>{const r=(S.recs[d]||{})[s.id];if(r&&r.hwat&&!r.hwsent&&(r.hwtext||'').trim())a.push({d,s,due:r.hwat+HRM})}));
 return a.sort((x,y)=>x.due-y.due);
}
const isPend=(d,sid)=>{const r=R(d,sid);return !!(r.hwat&&!r.hwsent&&(r.hwtext||'').trim())};
function renderPB(){
 const e=document.getElementById('pb');if(!e)return;
 const a=pendList(),n=Date.now(),td=iso(new Date());
 e.innerHTML=a.length?`<div class="pbx"><b>Homework to send (${a.length})</b>${a.map(x=>{const m=Math.ceil((x.due-n)/6e4),late=m<=0,k=x.d+'|'+x.s.id;return `<div class="row"><div>${esc(x.s.name)}${x.d!==td?' <span class="mu">('+fmt(x.d).slice(0,5)+')</span>':''}: ${late?'<span class="warn">time to send</span>':'<span class="mu">send in '+m+' min</span>'}</div><button class="sm" data-pb="${k}">Open</button><button class="sm" data-ps="${k}">Mark sent</button></div>`}).join('')}</div>`:'';
}
function mark(){dirty=true;const e=document.getElementById('sv');if(e){e.textContent='Not saved';e.className='warn'}}
function setF(f,v,tog){dr[f]=(tog&&dr[f]===v)?'':v;mark()}
function setMarks(marks){dr.tmk=marks;mark();draw()}
function okLeave(){if(!dirty)return true;if(confirm('You have unsaved changes. Leave without saving?')){dirty=false;dk='';ttk='';if(sylSel){const o=SY().find(x=>x.id===sylSel);sd=o?JSON.parse(JSON.stringify(o)):null}return true}return false}
function doSave(){
 if((dr.hwtext||'').trim()){if(!dr.hwat)dr.hwat=Date.now()}else{delete dr.hwat;delete dr.hwsent}
 if(!dr.am){dr.att=autoAtt(dr,date);dr.aa=1}
 const o=S.recs[date]||(S.recs[date]={});o[sel]=JSON.parse(JSON.stringify(dr));
 const p0=prevHw(sel,date);if(p0&&dhw!==undefined){S.recs[p0][sel].hw=dhw;S.recs[p0][sel].hwnote=dhw==='N'?dhn.trim():''}
 store();
 for(const kd of KP){if(dph[kd]!==undefined){const k=pkk(date,sel,kd);PH[k]=dph[kd];pput(k,dph[kd])}}dph={};
 dirty=false;draw();
 const e=document.getElementById('sv');if(e){e.textContent='Saved';e.className='mu'}
}
let MODE='';try{MODE=localStorage.getItem('tms_mode')||''}catch(e){}
if(!MODE)MODE=(screen.width>=900)?'desk':'phone';
function applyMode(){document.documentElement.classList.toggle('desk',MODE==='desk');const m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute('content',MODE==='desk'?'width=1100, viewport-fit=cover':'width=device-width, initial-scale=1, viewport-fit=cover');const b=document.getElementById('md');if(b)b.textContent=MODE==='desk'?'Phone mode':'Desktop mode'}
function seg(r,f,opts,pd){return `<div class="seg">${opts.map(([v,l])=>`<button class="${r[f]===v?'on':''}" data-f="${f}" data-v="${v}"${pd?` data-pd="${pd}"`:''}>${l}</button>`).join('')}</div>`}
function prevHw(sid,d){const ks=Object.keys(S.recs).filter(k=>k<d&&((S.recs[k][sid]||{}).hwtext||'').trim()).sort();return ks.length?ks[ks.length-1]:null}
const SEEDG={mahi:'A',ansh:'A',duggu:'B',vaidik:'B',ayush:'C',ayus:'C',simran:'C'};
const okTok=c=>/^[A-Z0-9]{16}$/.test(String(c||''));
function genTok(used){
 const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint8Array(16);let t;
 do{(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);t=Array.from(a).map(v=>A[v%32]).join('')}while(used.has(t));
 return t;
}
/* Students in the same group (same parents) share one link key; a student without a group has their own. */
function ensurePC(){
 const fam={};
 S.students.forEach(x=>{const g=String(x.bt||'').trim().toLowerCase(),k=g?'g:'+g:'s:'+x.id;(fam[k]=fam[k]||[]).push(x)});
 const used=new Set();let n=0;
 Object.keys(fam).forEach(k=>{
  const m=fam[k];let t=m.map(x=>x.pc).find(c=>okTok(c)&&!used.has(c));
  if(!t)t=genTok(used);
  used.add(t);m.forEach(x=>{if(x.pc!==t){x.pc=t;n++}});
 });
 if(n){S.ts=Date.now();persist();push()}
 return n;
}
const parentLink=x=>new URL('parent.html',location.href).href+'?c='+x.pc;
function seedGroups(){
 if(!S.students.length||S.gseed)return;
 S.gseed=true;let n=0;
 S.students.forEach(x=>{const g=SEEDG[String(x.name).trim().toLowerCase()];if(g&&!x.bt){x.bt=g;n++}});
 S.ts=Date.now();persist();if(n)push();
}
function grpChips(fn){
 const keys=[],m={};
 S.students.forEach(x=>{const k=String(x.bt||'').trim();(m[k]=m[k]||[]).push(x);if(k&&!keys.includes(k))keys.push(k)});
 return keys.map(k=>`<span class="grp">${m[k].map(fn).join('')}</span>`).join('')+(m['']||[]).map(fn).join('');
}
const hasHw=r=>!!String((r&&r.hwtext)||'').trim();
const autoAtt=(r,d)=>hasHw(r)?'P':(isSun(d)?'H':'A');
const manualAtt=r=>!!(r.am||(r.att&&!r.aa));
function attHTML(){
 const r=dr,lab={P:'Present',A:'Absent',H:'Holiday'};
 const note=r.am?'Manual. Tap the selected button again to go back to auto.':'Auto: '+lab[r.att]+(r.att==='P'?' (homework given)':r.att==='H'?' (Sunday)':' (no homework given)');
 return seg(r,'att',[['P','Present'],['A','Absent'],['H','Holiday']])+`<p class="mu" style="margin:4px 0 0">${note}</p>`;
}
function hwBanner(){
 if(date!==iso(new Date())||isSun(date))return '';
 const miss=S.students.filter(s=>{const r=s.id===sel?dr:R(date,s.id);if(hasHw(r))return false;if(manualAtt(r)&&(r.att==='A'||r.att==='H'))return false;return true});
 if(!miss.length)return '';
 return `<div class="pbx"><b>\u26A0\uFE0F Homework not given today:</b> ${miss.map(x=>esc(x.name)).join(', ')}</div>`;
}
function refreshAtt(){
 if(!dr.am){dr.att=autoAtt(dr,date);dr.aa=1}
 const a=document.getElementById('attbox');if(a)a.innerHTML=attHTML();
 const h=document.getElementById('hwb');if(h)h.innerHTML=hwBanner();
}
const noteType=()=>dr.ntp||(String(dr.nnote||'').trim()?'N':'P');
function setNote(txt){const ty=noteType();if(ty==='N'){dr.nnote=txt;dr.pnote=''}else{dr.pnote=txt;dr.nnote=''}dr.ntp=ty;mark()}
function noteBox(){
 const t=noteType(),txt=t==='N'?dr.nnote:dr.pnote;
 const bt=(v,l,on,css)=>`<button class="chip" data-nt="${v}" style="min-height:30px;padding:2px 10px;font-size:13px;${on?css:''}">${l}</button>`;
 return `<div class="row" style="margin:12px 0 6px"><div style="color:var(--mu);font-size:14px">Note</div>${bt('P','\u{1F7E2} Good',t==='P','background:var(--ac);color:var(--on);border-color:var(--ac)')}${bt('N','\u{1F534} Needs attention',t==='N','background:#d9433f;color:#fff;border-color:#d9433f')}</div><textarea data-nt-text style="min-height:56px">${esc(txt)}</textarea>`;
}
function vEntry(){
 if(!S.students.length)return '<div class="c">First add students in the "Students" tab.</div>';
 if(!S.students.find(s=>s.id===sel))sel=S.students[0].id;
 if(dk!==date+'|'+sel){dk=date+'|'+sel;dr=JSON.parse(JSON.stringify(R(date,sel)));if(dr.att&&!dr.aa&&!dr.am)dr.am=1;const p0=prevHw(sel,date);dhw=p0?(R(p0,sel).hw||''):undefined;dhn=p0?(R(p0,sel).hwnote||''):'';dph={};dirty=false;qSub='';wSub=''}
 if(!dr.am){dr.att=autoAtt(dr,date);dr.aa=1}
 const st=S.students.find(s=>s.id===sel),r=dr,pv=prevHw(sel,date);
 const chips=grpChips(s=>`<button class="chip ${s.id===sel?'on':''} ${R(date,s.id).att?'done':''}" data-sel="${s.id}">${esc(s.name)}${isPend(date,s.id)?' <span class="warn">\u25CF</span>':''}</button>`);
 const full=r.am?(r.att!=='A'&&r.att!=='H'):true;
 return `<div id="hwb">${hwBanner()}</div><input type="date" id="dt" value="${date}">${dateInfo(date)}<div class="chips">${chips}</div>${ttBanner()}${examBanner()}
 <div class="c"><h2>${esc(st.name)} <span class="mu">Class ${esc(st.cls)}</span></h2>
 ${pv?`<div style="background:var(--soft);border-radius:10px;padding:10px;margin:8px 0"><b>Check previous homework</b><p class="mu" style="margin:4px 0">Assigned on ${fmt(pv)}: ${esc(R(pv,sel).hwtext)}</p><label style="margin-top:8px">Homework completed?</label>${seg({hw:dhw},'hw',[['Y','Yes'],['N','No']],pv)}${dhw==='N'?`<label style="margin-top:8px">Why not completed? (child's reason)</label><textarea data-rn style="min-height:56px">${esc(dhn)}</textarea>`:''}</div>`:''}

Topic 1

async function combinedPhotoShare(){

 if(!dr.hwtext||!dr.hwtext.trim()){alert('Write homework first');return}
 const photos=[['\u{1F4DD} HOMEWORK',PH[pkk(date,sel,'hw')]],['\u2705 COVERED IN TODAY\'S CLASS',PH[pkk(date,sel,'wk')]],['\u{1F4CA} TEST',PH[pkk(date,sel,'ts')]]].filter(x=>x[1]);

async function mkpdf(){
 const ms=document.getElementById('ms'),el=document.getElementById('rp');
 ms.textContent='Creating PDF...';
 try{
  const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'});
  const m=20,w=595-2*m,k=w/cv.width,ph=Math.floor((842-2*m)/k);
  for(let y=0,p=0;y<cv.height;y+=ph,p++){
   const h=Math.min(ph,cv.height-y),t=document.createElement('canvas');t.width=cv.width;t.height=h;
   const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
   if(p)pdf.addPage();pdf.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',m,m,w,h*k);
  }
  const nm=S.students.find(s=>s.id===rs).name.replace(/[^A-Za-z0-9]+/g,'_')||'student';
  const fn='Report_'+nm+'_'+from+'_to_'+to+'.pdf',blob=pdf.output('blob');
  const f=new File([blob],fn,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   try{await navigator.share({files:[f],title:fn,text:summaryText()});ms.textContent='PDF shared.';return}catch(x){if(x&&x.name==='AbortError'){ms.textContent='Share cancelled.';return}}
  }
  dlFile(fn,blob);ms.textContent='PDF downloaded.';
 }catch(e){ms.textContent='Could not create the PDF. Please try again.'}
}
