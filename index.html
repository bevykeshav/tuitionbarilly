<script>
let S={students:[],recs:{},teacher:'Keshav Gangwar',subjects:['SST','Math','Science','Hindi','English']};
const SUB=()=>(S.subjects&&S.subjects.length)?S.subjects:['SST','Math','Science'];
try{const r=localStorage.getItem('tms1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const persist=()=>{try{localStorage.setItem('tms1',JSON.stringify(S))}catch(e){}};
const store=()=>{S.ts=Date.now();persist();push()};
const DEF_URL='https://script.google.com/macros/s/AKfycbzVTdVBoJtSjvCiQPbuLv6ovyJBH2QJm47WFXxXgv5O10dR4v6A5r16iWCiOIN1fRiYoQ/exec';
let CU=DEF_URL;try{CU=localStorage.getItem('tms_url')||DEF_URL}catch(e){}
let tmr=null,busy=false,again=false;
function sy(t){const e=document.getElementById('sy');if(e)e.textContent=t}
async function call(b){const r=await fetch(CU,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return r.json()}
function push(){if(!CU)return;clearTimeout(tmr);sy('Cloud: syncing...');tmr=setTimeout(doPush,2000)}
async function doPush(){
 if(busy){again=true;return}busy=true;
 try{const r=await call({a:'put',data:S});sy(r.ok?'Cloud: saved':'Cloud: error, will retry')}
 catch(e){sy('Cloud: offline, will sync when online');again=true}
 busy=false;if(again&&navigator.onLine){again=false;push()}
}
async function pull(){
 if(!CU)return;sy('Checking cloud...');
 try{
  const r=await call({a:'get'});
  if(!r.ok){sy('Cloud: error, check the link');return}
  const rt=r.data?(r.data.ts||0):0;
  if(rt>(S.ts||0)){S=Object.assign({students:[],recs:{},teacher:'Keshav Gangwar',subjects:['SST','Math','Science','Hindi','English']},r.data);persist();dk='';dirty=false;draw();sy('Data loaded from cloud')}
  else if((S.ts||0)>rt){await doPush()}
  else sy('Cloud: everything is up to date')
 }catch(e){sy('Cloud: offline')}
}
let ip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;const b=document.getElementById('ib');if(b)b.style.display=''});
window.addEventListener('appinstalled',()=>{ip=null;const b=document.getElementById('ib');if(b)b.style.display='none'});
window.addEventListener('online',()=>{if(again)push()});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=new Date();
let tab='entry',date=iso(today),sel=null,rs=null,pend=null,msg='',editId=null,newWt='b',editWt='b';
let from=iso(new Date(today.getTime()-6*864e5)),to=iso(today);
const R=(d,s)=>((S.recs[d]||{})[s])||{};
let dr={},dk='',dhw,dhn='',dph={},dirty=false;
const KP=['hw','wk','ts'];
const pkk=(d,s,kd)=>kd==='hw'?d+'|'+s:d+'|'+s+'|'+kd;
function phv(kd){return dph[kd]!==undefined?dph[kd]:PH[pkk(date,sel,kd)]}
function photoUI(kd,label){const u=phv(kd);return `<label>${label}</label>${u?`<img src="${u}" style="max-width:160px;border-radius:8px;display:block;margin:6px 0"><button data-ph="${kd}">Remove photo</button>`:''}<input type="file" data-pf="${kd}" accept="image/*" capture="environment">`}
function imgH(kd,d){const u=PH[pkk(d,rs,kd)];return u?'<img src="'+u+'" style="width:100px;display:block;margin:4px 0;border:1px solid #444">':''}
const HRM=36e5;
function pendList(){
 const lim=iso(new Date(Date.now()-2*864e5)),a=[];
 Object.keys(S.recs).filter(d=>d>=lim).forEach(d=>S.students.forEach(s=>{const r=(S.recs[d]||{})[s.id];if(r&&r.hwat&&!r.hwsent&&(r.hwtext||'').trim())a.push({d,s,due:r.hwat+HRM})}));
 return a.sort((x,y)=>x.due-y.due);
}
const isPend=(d,sid)=>{const r=R(d,sid);return !!(r.hwat&&!r.hwsent&&(r.hwtext||'').trim())};
function renderPB(){
 const e=document.getElementById('pb');if(!e)return;
 const a=pendList(),n=Date.now(),td=iso(new Date());
 e.innerHTML=a.length?`<div class="pbx"><b>Homework to send (${a.length})</b>${a.map(x=>{const m=Math.ceil((x.due-n)/6e4),late=m<=0,k=x.d+'|'+x.s.id;return `<div class="row"><div>${esc(x.s.name)}${x.d!==td?' <span class="mu">('+fmt(x.d).slice(0,5)+')</span>':''}: ${late?'<span class="warn">time to send</span>':'<span class="mu">send in '+m+' min</span>'}</div><button class="sm" data-pb="${k}">Open</button><button class="sm" data-ps="${k}">Mark sent</button></div>`}).join('')}</div>`:'';
}
function alarmOpen(b){
 const st=S.students.find(x=>x.id===sel)||{name:''},base=Math.max((dr.hwat||Date.now())+HRM,Date.now()+12e4),d=new Date(base);
 const title='Send homework: '+String(st.name).replace(/[,;\n]/g,' ');
 const z=t=>new Date(t).toISOString().replace(/[-:]|\.\d{3}/g,'');
 const ics=()=>{
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tuition//EN','BEGIN:VEVENT','UID:hw'+base+'@tuition','DTSTAMP:'+z(Date.now()),'DTSTART:'+z(base),'DTEND:'+z(base+9e5),'SUMMARY:'+title,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'];
  dlFile('homework-reminder.ics',new Blob([L.join('\r\n')],{type:'text/calendar'}));
  b.textContent='Reminder file downloaded. Tap it to add to Calendar';
 };
 if(!/Android/i.test(navigator.userAgent)){ics();return}
 let left=false;const f=()=>{left=true};
 document.addEventListener('visibilitychange',f,{once:true});window.addEventListener('blur',f,{once:true});
 location.href='intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR='+d.getHours()+';i.android.intent.extra.alarm.MINUTES='+d.getMinutes()+';S.android.intent.extra.alarm.MESSAGE='+encodeURIComponent(title)+';end';
 setTimeout(()=>{document.removeEventListener('visibilitychange',f);window.removeEventListener('blur',f);if(!left&&!document.hidden)ics()},1800);
}
function mark(){dirty=true;const e=document.getElementById('sv');if(e){e.textContent='Not saved';e.className='warn'}}
function setF(f,v,tog){dr[f]=(tog&&dr[f]===v)?'':v;mark()}
function okLeave(){if(!dirty)return true;if(confirm('You have unsaved changes. Leave without saving?')){dirty=false;dk='';ttk='';if(sylSel){const o=SY().find(x=>x.id===sylSel);sd=o?JSON.parse(JSON.stringify(o)):null}return true}return false}
function doSave(){
 if((dr.hwtext||'').trim()){if(!dr.hwat)dr.hwat=Date.now()}else{delete dr.hwat;delete dr.hwsent}
 const o=S.recs[date]||(S.recs[date]={});o[sel]=JSON.parse(JSON.stringify(dr));
 const p0=prevHw(sel,date);if(p0&&dhw!==undefined){S.recs[p0][sel].hw=dhw;S.recs[p0][sel].hwnote=dhw==='N'?dhn.trim():''}
 store();
 for(const kd of KP){if(dph[kd]!==undefined){const k=pkk(date,sel,kd);PH[k]=dph[kd];pput(k,dph[kd])}}dph={};
 dirty=false;draw();
 const e=document.getElementById('sv');if(e){e.textContent='Saved';e.className='mu'}
}
let MODE='';try{MODE=localStorage.getItem('tms_mode')||''}catch(e){}
if(!MODE)MODE=(screen.width>=900)?'desk':'phone';
function applyMode(){document.documentElement.classList.toggle('desk',MODE==='desk');const m=document.querySelector('meta[name=viewport]');if(m)m.setAttribute('content',MODE==='desk'?'width=1100, viewport-fit=cover':'width=device-width, initial-scale=1, viewport-fit=cover');const b=document.getElementById('md');if(b)b.textContent=MODE==='desk'?'Phone mode':'Desktop mode'}
function seg(r,f,opts,pd){return `<div class="seg">${opts.map(([v,l])=>`<button class="${r[f]===v?'on':''}" data-f="${f}" data-v="${v}"${pd?` data-pd="${pd}"`:''}>${l}</button>`).join('')}</div>`}
function prevHw(sid,d){const ks=Object.keys(S.recs).filter(k=>k<d&&((S.recs[k][sid]||{}).hwtext||'').trim()).sort();return ks.length?ks[ks.length-1]:null}
function vEntry(){
 if(!S.students.length)return '<div class="c">First add students in the "Students" tab.</div>';
 if(!S.students.find(s=>s.id===sel))sel=S.students[0].id;
 if(dk!==date+'|'+sel){dk=date+'|'+sel;dr=JSON.parse(JSON.stringify(R(date,sel)));const p0=prevHw(sel,date);dhw=p0?(R(p0,sel).hw||''):undefined;dhn=p0?(R(p0,sel).hwnote||''):'';dph={};dirty=false;qSub='';wSub=''}
 const st=S.students.find(s=>s.id===sel),r=dr,pv=prevHw(sel,date);
 const chips=S.students.map(s=>`<button class="chip ${s.id===sel?'on':''} ${R(date,s.id).att?'done':''}" data-sel="${s.id}">${esc(s.name)}${isPend(date,s.id)?' <span class="warn">\u25CF</span>':''}</button>`).join('');
 const full=r.att!=='A';
 return `<input type="date" id="dt" value="${date}"><div class="chips">${chips}</div>${ttBanner()}
 <div class="c"><h2>${esc(st.name)} <span class="mu">Class ${esc(st.cls)}</span></h2>
 ${pv?`<div style="background:var(--soft);border-radius:10px;padding:10px;margin:8px 0"><b>Check previous homework</b><p class="mu" style="margin:4px 0">Assigned on ${fmt(pv)}: ${esc(R(pv,sel).hwtext)}</p><label style="margin-top:8px">Homework completed?</label>${seg({hw:dhw},'hw',[['Y','Yes'],['N','No']],pv)}${dhw==='N'?`<label style="margin-top:8px">Why not completed? (child's reason)</label><textarea data-rn style="min-height:56px">${esc(dhn)}</textarea>`:''}</div>`:''}
 <div class="fg">
 <div class="fb"><label>Attendance</label>${seg(r,'att',[['P','Present'],['A','Absent']])}</div>
 <div class="fb"><label>Homework</label><textarea data-t="hwtext">${esc(r.hwtext)}</textarea><button class="sm" data-qo="1" style="margin-top:8px">${qOpen?'Hide quick homework':'Quick homework (from syllabus)'}</button>${qOpen?quickHw('hw'):''}<button class="pri" id="wa" style="margin-top:8px">Send Homework on WhatsApp</button><button class="sm" id="alm" style="margin-top:8px;width:100%">Set alarm for 1 hour (to send homework)</button>${r.hwsent?`<p class="mu" style="margin:6px 0 0">\u2705 Homework sent (${new Date(r.hwsent).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})})</p>`:(r.hwat?`<p class="mu" style="margin:6px 0 0">Not sent yet</p>`:'')}</div>
 <div class="fb">${photoUI('hw','Homework photo (notebook or book)')}</div>
 ${full?`<div class="fb"><label>Covered in class</label><textarea data-t="work">${esc(r.work)}</textarea><button class="sm" data-wo="1" style="margin-top:8px">${wOpen?'Hide quick list':'Quick (from syllabus)'}</button>${wOpen?quickHw('wk'):''}${photoUI('wk','Classwork photo')}</div>
 <div class="fb"><label>Notebook (which ones are at school)</label>${SUB().map(sj=>`<div class="row"><div>${esc(sj)}</div>${seg(r,'nb_'+sj,[['H','With child'],['S','At school']])}</div>`).join('')}</div>
 <div class="fb"><label>Test (if taken)</label><div class="row"><input data-t="tsub" placeholder="Subject / topic" value="${esc(r.tsub)}"><input data-t="tmk" placeholder="Marks e.g. 18/20" value="${esc(r.tmk)}" style="max-width:140px"></div>${photoUI('ts','Test or marks photo')}</div>
 <div class="fb"><label>Rating</label>${seg(r,'rt',[['Bad','Bad'],['Good','Good'],['Better','Better'],['Best','Best']])}</div>`:''}
 <div class="fb"><label>Note</label><textarea data-t="note">${esc(r.note)}</textarea></div>
 </div></div>
 <div class="sb"><span id="sv" class="${dirty?'warn':'mu'}">${dirty?'Not saved':'Saved'}</span><button class="pri" id="svb">Save</button></div>`;
}
let _db=null;
function idb(){return _db||(_db=new Promise((ok,no)=>{try{const q=indexedDB.open('tms',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}}))}
async function pget(k){const d=await idb();return new Promise(ok=>{const r=d.transaction('p').objectStore('p').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function pput(k,v){const d=await idb();return new Promise(ok=>{const t=d.transaction('p','readwrite');v?t.objectStore('p').put(v,k):t.objectStore('p').delete(k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}
const PH={},pk=(d,s)=>d+'|'+s;
async function ensure(keys){let got=false;for(const k of keys){if(!(k in PH)){try{PH[k]=await pget(k)}catch(e){PH[k]=null}if(PH[k])got=true}}if(got)draw()}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.65))};im.onerror=no;im.src=u})}
function hint(t){const ls=String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);let o=ls.slice(0,2).join('\n'),cut=ls.length>2;if(o.length>70){o=o.slice(0,70).replace(/\s+\S*$/,'');cut=true}return esc(o).replace(/\n/g,'<br>')+(cut?' ...':'')}
const pct=r=>{const m=String(r.tmk||'').match(/([\d.]+)\s*\/\s*([\d.]+)/);return m&&+m[2]>0?+m[1]/+m[2]*100:null};
function tCell(r){if(!r.tsub&&!r.tmk)return '-';const p=pct(r);const mk=r.tmk?(p===null?esc(r.tmk):col(esc(r.tmk),p>=40)):'';return (r.tsub?esc(r.tsub)+(mk?'<br>':''):'')+mk}
function summaryText(){
 const st=S.students.find(s=>s.id===rs);if(!st)return '';
 const rows=stats(rs),c=(f,v)=>rows.filter(x=>x[1][f]===v).length;
 const pl=(n,a,b)=>n+' '+(n===1?a:b);
 const nb=rows.reduce((n,x)=>n+SUB().filter(s=>x[1]['nb_'+s]==='S').length,0);
 const tn=rows.filter(x=>x[1].tsub||x[1].tmk).length,tp=rows.map(x=>pct(x[1])).filter(v=>v!==null),ta=tp.length?Math.round(tp.reduce((a,b)=>a+b,0)/tp.length):null;
 const P=c('att','P'),A=c('att','A'),hy=c('hw','Y'),hn=c('hw','N'),bad=c('rt','Bad'),good=c('rt','Good')+c('rt','Better')+c('rt','Best');
 const pos=[],neg=[];
 if(P)pos.push('\u2705 Present: '+pl(P,'day','days'));
 if(hy)pos.push('\u2705 Homework completed: '+pl(hy,'time','times'));
 if(tn&&(ta===null||ta>=40))pos.push('\u2705 Tests: '+tn+' taken'+(ta===null?'':', average '+ta+'%'));
 if(good)pos.push('\u2705 Good performance ratings (Good/Better/Best): '+pl(good,'time','times'));
 if(A)neg.push('\u274C Absent: '+pl(A,'day','days'));
 if(hn){neg.push('\u274C Homework not completed: '+pl(hn,'time','times'));
  rows.filter(x=>x[1].hw==='N'&&x[1].hwnote).slice(0,3).forEach(x=>neg.push('     Reason ('+fmt(x[0]).slice(0,5)+'): '+String(x[1].hwnote).trim().slice(0,60)))}
 if(nb)neg.push('\u274C Notebook was kept at school: '+pl(nb,'time','times'));
 if(tn&&ta!==null&&ta<40)neg.push('\u274C Low test average: '+ta+'%');
 if(bad)neg.push('\u274C Needs improvement (Bad rating): '+pl(bad,'time','times'));
 const L=['\u{1F4CA} *'+st.name+' (Class '+st.cls+') - Progress Report*','\u{1F5D3}\uFE0F '+fmt(from)+' to '+fmt(to),''];
 if(pos.length)L.push('\u{1F31F} *Highlights*',...pos,'');
 L.push('\u26A0\uFE0F *Areas to Improve*');
 if(neg.length)L.push(...neg);else L.push('No concerns during this period.');
 const sy=sylInfo(rs);
 if(sy.length){L.push('','\u{1F4D8} *Syllabus*');sy.forEach(x=>{L.push(x.n+': '+x.d+'/'+x.t+' topics completed ('+Math.round(x.d*100/x.t)+'%), '+(x.t-x.d)+' remaining');if(x.per.length)L.push('Covered in this period: '+x.per.slice(0,5).join('; ')+(x.per.length>5?' ...':''))})}
 const enc=neg.length?'\u{1F64F} With a little more attention, we can do even better. Let us work on it together.':(pos.length?'\u{1F31F} Excellent performance! Keep up the good work.':'');
 if(enc)L.push('',enc);
 L.push('','\u{1F4CE} Please see the attached PDF for full details.','- '+S.teacher+' (Tuition Teacher)');
 return L.join('\n');

 return `<div class="chips">${chips}</div><div class="c"><div class="seg"><button data-q="w">Last 7 days</button><button data-q="m">This month</button></div>
 <div class="row"><div><label>From</label><input type="date" id="fr" value="${from}"></div><div><label>To</label><input type="date" id="to" value="${to}"></div></div>
 <button class="pri" id="mk">Create PDF and Share</button><p class="mu" id="ms">${esc(msg)}</p>
 <label>This summary message will be sent with the PDF</label><div class="mu" style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px">${esc(summaryText())}</div>
 <div class="seg" style="margin-top:8px"><button id="sw">Send Summary on WhatsApp</button><button id="sc">Copy Summary</button></div></div>
 <div class="wrap">${build()}</div>`;
}
function vStu(){
 const list=S.students.map(s=>editId===s.id?`<div style="background:var(--soft);border-radius:10px;padding:10px;margin:8px 0"><input data-en value="${esc(s.name)}" placeholder="Name" style="margin-bottom:8px"><div class="row"><input data-ec value="${esc(s.cls)}" placeholder="Class" style="max-width:90px"><input data-ep inputmode="tel" value="${esc(s.ph)}" placeholder="Parent WhatsApp number"></div><label>Which WhatsApp does the parent use?</label>${wtSeg(editWt,'e')}<div class="seg" style="margin-top:10px"><button class="on" id="esave">Save</button><button id="ecancel">Cancel</button></div></div>`:`<div class="row"><div>${esc(s.name)} <span class="mu">Class ${esc(s.cls)}${s.ph?' | '+esc(s.ph)+' ('+(s.wt==='w'?'WhatsApp':'Business')+')':''}</span></div><button data-edit="${s.id}">Edit</button><button data-del="${s.id}">${pend===s.id?'Confirm delete?':'Delete'}</button></div>`).join('')||'<p class="mu">No students yet.</p>';
 return `<div class="c"><h2>Settings</h2><label>Teacher name</label><input data-teacher value="${esc(S.teacher)}"><label>Notebook subjects</label><input data-subjects value="${esc(SUB().join(', '))}"><p class="mu">Separate with commas, e.g. SST, Math, Science</p><button class="pri" id="ss">Save Settings</button></div>
 <div class="c"><h2>Add Student</h2><div class="row"><input id="nn" placeholder="Name"><input id="nc" placeholder="Class" style="max-width:90px"></div><input id="np" inputmode="tel" placeholder="Parent WhatsApp number (optional)" style="margin-bottom:8px"><label>Which WhatsApp does the parent use?</label>${wtSeg(newWt,'n')}<button class="pri" id="add" style="margin-top:10px">Add</button></div>
 <div class="c"><h2>All Students</h2>${list}</div>
 ${ttCard()}
 <div class="c"><h2>Cloud Backup (Google Sheets)</h2><input data-cu value="${esc(CU)}" placeholder="Apps Script web app link"><p class="mu">On another device, open the app empty and enter this link to load the existing data.</p><button class="pri" id="cu">Sync now</button></div>
 <div class="c"><h2>Backup</h2><p class="mu">Data is stored in this device's browser. Take a backup before changing devices.</p><button id="bk">Save Backup</button><label>Restore Backup</label><input type="file" id="rs" accept=".json"><p class="mu" id="ms">${esc(msg)}</p></div>`;
}
function draw(){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 $v.innerHTML=tab==='entry'?vEntry():tab==='rep'?vRep():tab==='syl'?vSyl():vStu();
 if(tab==='entry'&&sel)ensure(KP.map(kd=>pkk(date,sel,kd)));
 else if(tab==='rep'&&rs)ensure(stats(rs).flatMap(x=>KP.map(kd=>pkk(x[0],rs,kd))));
 renderPB();
}
const $v=document.getElementById('v');
function dlFile(name,blob){
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function mkpdf(){
 const ms=document.getElementById('ms'),el=document.getElementById('rp');
 ms.textContent='Creating PDF...';
 try{
  const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'});
  const m=20,w=595-2*m,k=w/cv.width,ph=Math.floor((842-2*m)/k);
  for(let y=0,p=0;y<cv.height;y+=ph,p++){
   const h=Math.min(ph,cv.height-y),t=document.createElement('canvas');t.width=cv.width;t.height=h;
   const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
   if(p)pdf.addPage();pdf.addImage(t.toDataURL('image/jpeg',0.92),'JPEG',m,m,w,h*k);
  }
  const nm=S.students.find(s=>s.id===rs).name.replace(/[^A-Za-z0-9]+/g,'_')||'student';
  const fn='Report_'+nm+'_'+from+'_to_'+to+'.pdf',blob=pdf.output('blob');
  const f=new File([blob],fn,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   try{await navigator.share({files:[f],title:fn,text:summaryText()});ms.textContent='PDF shared.';return}catch(x){if(x&&x.name==='AbortError'){ms.textContent='Share cancelled.';return}}
  }
  dlFile(fn,blob);ms.textContent='PDF downloaded.';
 }catch(e){ms.textContent='Could not create the PDF. Please try again.'}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){if(!okLeave())return;tab=d.tab;msg='';editId=null;draw()}
 else if(d.edit){editId=d.edit;pend=null;const e0=S.students.find(x=>x.id===d.edit);editWt=(e0&&e0.wt)||'b';draw()}
 else if(d.wt){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(d.wtf==='e')editWt=d.wt;else newWt=d.wt}
 else if(d.sel){if(!okLeave())return;sel=d.sel;draw()}
 else if(d.rs){rs=d.rs;draw()}
 else if(d.ph){dph[d.ph]=null;mark();draw()}
 else if(d.f){if(d.pd){dhw=(dhw===d.v)?'':d.v;mark()}else setF(d.f,d.v,true);draw()}
 else if(d.q){const n=new Date();to=iso(n);from=d.q==='w'?iso(new Date(n.getTime()-6*864e5)):iso(new Date(n.getFullYear(),n.getMonth(),1));draw()}
 else if(d.del){if(pend===d.del){S.students=S.students.filter(s=>s.id!==d.del);pend=null;store()}else pend=d.del;draw()}
 else if(b.id==='add'){const n=document.getElementById('nn').value.trim(),c=document.getElementById('nc').value.trim(),p=document.getElementById('np').value.replace(/\D/g,'');if(n){S.students.push({id:'s'+Date.now(),name:n,cls:c,ph:p,wt:newWt});store();draw()}}
 else if(b.id==='wa'){
  const st=S.students.find(s=>s.id===sel),r=dr;
  if(!r.hwtext||!r.hwtext.trim()){b.textContent='Write the homework first';return}
  const t=hwMessage(st);
  dr.hwsent=Date.now();doSave();
  waOpen(st,t);
 }
 else if(b.id==='alm'){alarmOpen(b)}
 else if(d.pb){const q=d.pb.split('|');if(!okLeave())return;tab='entry';date=q[0];sel=q[1];msg='';draw();window.scrollTo(0,0)}
 else if(d.ps){const q=d.ps.split('|'),r=(S.recs[q[0]]||{})[q[1]];if(r){r.hwsent=Date.now();if(date===q[0]&&sel===q[1])dr.hwsent=r.hwsent;store();draw()}}
 else if(b.id==='mk')mkpdf();
 else if(d.gtt){if(!okLeave())return;tab='stu';ttSel=sel;ttk='';draw();const e=document.getElementById('ttcard');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth'})}
 else if(d.tts){if(!okLeave())return;ttSel=d.tts;ttk='';draw()}
 else if(d.ttsub!==undefined){b.classList.toggle('on');const a=ttd[d.ttday]||(ttd[d.ttday]=[]),i=a.indexOf(d.ttsub);if(i>=0)a.splice(i,1);else a.push(d.ttsub);mark()}
 else if(b.id==='ttsave'){S.tt=S.tt||{};S.tt[ttSel]=JSON.parse(JSON.stringify(ttd));store();dirty=false;const m=document.getElementById('ttmsg');if(m)m.textContent='Timetable saved.'}
 else if(b.id==='ttall'){if(!confirm('All students will get this timetable. Continue?'))return;S.tt=S.tt||{};S.students.forEach(x=>{S.tt[x.id]=JSON.parse(JSON.stringify(ttd))});store();dirty=false;const m=document.getElementById('ttmsg');if(m)m.textContent='Applied to all students.'}
 else if(d.wo){wOpen=!wOpen;draw()}
 else if(d.ws){wSub=d.ws;draw()}
 else if(d.wh!==undefined){const l=WH[+d.wh];if(l){addWk(l);draw()}}
 else if(d.wg!==undefined){addWk(WKGEN[+d.wg]);draw()}
 else if(d.qo){qOpen=!qOpen;draw()}
 else if(d.qs){qSub=d.qs;draw()}
 else if(d.qh!==undefined){const l=QH[+d.qh];if(l){addHw(l);draw()}}
 else if(d.qg!==undefined){addHw(HWGEN[+d.qg]);draw()}
 else if(d.sopen){if(!okLeave())return;const o=SY().find(x=>x.id===d.sopen);sylSel=o?o.id:null;sd=o?JSON.parse(JSON.stringify(o)):null;sylF='all';editTxt=false;pend=null;dirty=false;draw()}
 else if(d.sylback){if(!okLeave())return;sylSel=null;sd=null;editTxt=false;pend=null;draw()}
 else if(d.sf){sylF=d.sf;draw()}
 else if(d.ti){const [si,ii]=d.ti.split('.').map(Number),it=sd.subs[si].items[ii];it.d=it.d?'':iso(new Date());mark();draw()}
 else if(d.sedit){editTxt=true;editStu=[...(sd.stu||[])];draw()}
 else if(d.es){b.classList.toggle('on');editStu=editStu.includes(d.es)?editStu.filter(x=>x!==d.es):[...editStu,d.es]}
 else if(b.id==='sxapply'){sd.subs=parseSyl(document.querySelector('[data-sxe]').value,sd.subs);sd.stu=[...editStu];editTxt=false;mark();draw()}
 else if(b.id==='sxcancel'){editTxt=false;draw()}
 else if(d.sdel){if(pend==='syl'){S.syl=SY().filter(x=>x.id!==sylSel);pend=null;sylSel=null;sd=null;dirty=false;store()}else pend='syl';draw()}
 else if(b.id==='ssv'){const i=SY().findIndex(x=>x.id===sd.id);if(i>=0)S.syl[i]=JSON.parse(JSON.stringify(sd));store();dirty=false;draw();const e=document.getElementById('sv');if(e){e.textContent='Saved';e.className='mu'}}
 else if(d.ns){b.classList.toggle('on');if(!newStu)newStu=S.students.map(s=>s.id);newStu=newStu.includes(d.ns)?newStu.filter(x=>x!==d.ns):[...newStu,d.ns]}
 else if(b.id==='snew'){const nm=document.querySelector('[data-sn]').value.trim(),subs=parseSyl(document.querySelector('[data-sx]').value),m=document.getElementById('smsg');if(!subs.length){m.textContent='The text is empty or in the wrong format. Each subject line must start with #.';return}SY().push({id:'y'+Date.now(),name:nm||'Syllabus',stu:newStu||S.students.map(s=>s.id),subs});newStu=null;store();draw()}
 else if(b.id==='sprompt'){try{await navigator.clipboard.writeText(SPROMPT);b.textContent='Prompt copied'}catch(x){b.textContent='Copy failed'}}
 else if(b.id==='ib'){if(ip){ip.prompt();ip=null;b.style.display='none'}}
 else if(b.id==='ecancel'){editId=null;draw()}
 else if(b.id==='esave'){const st=S.students.find(x=>x.id===editId),n=document.querySelector('[data-en]').value.trim();if(st&&n){st.name=n;st.cls=document.querySelector('[data-ec]').value.trim();st.ph=document.querySelector('[data-ep]').value.replace(/\D/g,'');st.wt=editWt;store()}editId=null;draw()}
 else if(b.id==='sw'){const st=S.students.find(s=>s.id===rs);waOpen(st,summaryText())}
 else if(b.id==='sc'){try{await navigator.clipboard.writeText(summaryText());b.textContent='Copied'}catch(x){b.textContent='Copy failed'}}
 else if(b.id==='svb')doSave();
 else if(b.id==='md'){MODE=MODE==='desk'?'phone':'desk';try{localStorage.setItem('tms_mode',MODE)}catch(x){}applyMode();draw()}
 else if(b.id==='ss'){S.teacher=document.querySelector('[data-teacher]').value.trim()||S.teacher;S.subjects=document.querySelector('[data-subjects]').value.split(',').map(x=>x.trim()).filter(Boolean);store();b.textContent='Saved'}
 else if(b.id==='cu'){const v=document.querySelector('[data-cu]').value.trim();CU=v;try{localStorage.setItem('tms_url',v)}catch(x){}if(S.students.length&&!S.ts){S.ts=Date.now();persist()}draw();pull()}
 else if(b.id==='bk'){dlFile('tuition-backup.json',new Blob([JSON.stringify(S)],{type:'application/json'}));document.getElementById('ms').textContent='Backup downloaded.'}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.t){setF(t.dataset.t,t.value,false)}
 else if(t.dataset.rn!==undefined){dhn=t.value;mark()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='dt'&&t.value){if(!okLeave()){draw();return}date=t.value;draw()}
 else if(t.dataset.pf&&t.files[0]){const kd=t.dataset.pf;shrink(t.files[0]).then(u=>{dph[kd]=u;mark();draw()}).catch(()=>{})}
 else if(t.id==='fr'&&t.value){from=t.value;draw()}
 else if(t.id==='to'&&t.value){to=t.value;draw()}
 else if(t.id==='rs'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);if(o&&Array.isArray(o.students)){S=Object.assign({students:[],recs:{},teacher:S.teacher,subjects:S.subjects},o);store();msg='Backup restored.'}else msg='This backup file looks invalid.'}catch(er){msg='This backup file looks invalid.'}draw()})}
});
setInterval(renderPB,30000);document.addEventListener('visibilitychange',renderPB);
applyMode();
draw();
pull();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
